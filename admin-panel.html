<style>
:root{
  --ink:#101418; --ink2:#1B2229; --graphite:#4B565F; --mist:#8A959D;
  --line:#D9DEE1; --line2:#EDF0F1; --paper:#F1F3F2; --card:#FFFFFF;
  --usu:#0A6E3C; --usu-deep:#04512A; --usu-soft:#E6F1EA;
  --amber:#96600A; --amber-soft:#FBF0DC; --rust:#9C3826; --rust-soft:#FAE9E5; --danger:#9C3826;
  --r:12px;
  --f-disp:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55}
h1,h2{font-family:var(--f-disp); font-weight:600; margin:0; letter-spacing:-.01em}
a{color:var(--usu)}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}

.topbar{background:var(--ink); color:#fff; border-bottom:1px solid #000}
.topbar-in{max-width:1000px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand b{font-family:var(--f-disp); font-weight:700; font-size:16px; display:block; line-height:1.1}
.brand small{font-family:var(--f-mono); font-size:9.5px; color:#8A959D; letter-spacing:.14em; text-transform:uppercase; display:block}
.logo{width:32px; height:32px; display:block; flex:0 0 32px}
.topbar-kanan[hidden]{display:none}
.akun-dropdown{position:relative}
.akun-tombol{background:none; border:1px solid #38424A; color:#fff; border-radius:var(--r); padding:6px 11px; cursor:pointer; font-family:var(--f-mono); font-size:13px; display:flex; align-items:center; gap:7px}
.akun-tombol:hover{background:#1B2229}
.akun-menu{position:absolute; right:0; top:calc(100% + 6px); min-width:170px; background:#1B2229; border:1px solid #38424A; border-radius:var(--r); box-shadow:0 8px 24px rgba(0,0,0,.35); overflow:hidden; z-index:60}
.akun-menu[hidden]{display:none}
.akun-menu button{display:block; width:100%; text-align:left; background:none; border:0; color:#fff; padding:10px 13px; font-size:13px; cursor:pointer}
.akun-menu button:hover{background:#252d35}

main{max-width:820px; margin:0 auto; padding:26px 20px 70px}
main > h1{font-size:22px; margin:6px 0 20px}

.login-box{max-width:380px; margin:40px auto 0; padding:0 20px 40px}
.login-box .card-b{padding:22px 22px 24px}
.login-box h1{font-size:20px; margin-bottom:6px; text-align:center}
.login-logo{width:66px; height:66px; margin:0 auto 12px; display:block}
.login-box .sub-login{color:var(--graphite); font-size:13.5px; text-align:center; margin-bottom:22px}
.login-box .hint-daftar{text-align:center; font-size:13px; color:var(--graphite); margin-top:16px}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 4px 14px rgba(16,20,24,.05); overflow:hidden}
.card-h{padding:13px 16px; border-bottom:1px solid var(--line2); background:var(--paper); display:flex; justify-content:space-between; align-items:center; gap:10px}
.card-h h2{font-size:16px}
.card-h .sub{font-size:12.5px; color:var(--mist)}
.card-b{padding:16px 18px}

.field{margin-bottom:13px}
.field label{display:block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--graphite); margin-bottom:5px}
.field input, .field select, .field textarea{width:100%; border:1px solid var(--line); border-radius:var(--r); padding:9px 11px; background:#fff}
.field textarea{min-height:80px; resize:vertical}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--usu); outline-offset:1px}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.hint{font-size:11.5px; color:var(--mist); margin-top:4px}

.btn{display:inline-block; border:1px solid transparent; border-radius:var(--r); padding:9px 16px; font-family:var(--f-disp); font-weight:600; font-size:13.5px; cursor:pointer}
.btn-p{background:var(--usu); color:#fff}
.btn-p:hover{background:#0c8449}
.btn-o{background:#fff; border-color:var(--line); color:var(--ink2)}
.btn-o:hover{background:var(--line2)}
.btn-d{background:#fff; border-color:var(--line); color:var(--danger)}
.btn-d:hover{background:#FBEAE7}
.btn-s{padding:6px 12px; font-size:12.5px}
.btn[disabled]{opacity:.55; cursor:default}

.tabs-admin{display:flex; align-items:center; gap:6px; margin-bottom:16px; flex-wrap:wrap}
.tabs-admin button{display:inline-flex; align-items:center; height:36px; box-sizing:border-box; background:#fff; border:1px solid var(--line); border-radius:99px; padding:0 16px; cursor:pointer; font-size:13.5px; font-family:var(--f-disp); font-weight:600; color:var(--ink2)}
.tabs-admin button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}

.entry{padding:13px 0; border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:0}
.entry-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px}
.entry h4{font-size:14.5px; margin:2px 0}
.entry .meta{font-size:13px; color:var(--graphite)}
.acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-family:var(--f-mono)}
.p-ver{background:var(--usu-soft); color:var(--usu-deep)}
.p-draft{background:var(--line2); color:var(--graphite)}

.empty{padding:26px 10px; text-align:center; color:var(--mist)}
.rail-tabs{
  position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:70;
  display:flex; flex-direction:column;
}
.rail-tabs a{
  color:#fff; text-decoration:none;
  font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  padding:16px 8px; border:1px solid #000; border-right:0; border-bottom:0;
  writing-mode:vertical-rl; text-orientation:mixed; box-shadow:-4px 0 14px rgba(0,0,0,.2);
}
.rail-tabs a:last-child{border-bottom:1px solid #000}
.rail-tabs a:first-child{border-radius:var(--r) 0 0 0}
.rail-tabs a:last-child{border-radius:0 0 0 var(--r)}
.rail-kalender{background:var(--usu)}
.rail-kalender:hover{background:#0c8449}
.rail-logbook{background:var(--usu-deep)}
.rail-logbook:hover{background:#04512A}
.rail-beranda{background:var(--ink)}
.rail-beranda:hover{background:#1B2229}
@media (max-width:640px){.rail-tabs a{padding:12px 6px; font-size:10px}}

.app-footer{position:fixed; left:0; right:0; bottom:0; z-index:65; background:rgba(16,20,24,.85); backdrop-filter:blur(4px); padding:7px 16px; text-align:center; font-family:var(--f-mono); font-size:10.5px; color:#C7CDD1; letter-spacing:.04em}
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--usu-deep)}
.modal-bg{
  position:fixed; inset:0; background:rgba(9,12,15,.6); z-index:120;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-bg[hidden]{display:none}
.modal-box{
  background:#fff; border-radius:var(--r); max-width:480px; width:100%; max-height:80vh;
  overflow-y:auto; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.35); position:relative;
}
.modal-x{position:sticky; top:-24px; text-align:right; margin:-24px -24px 0; padding:10px 14px 0}
.modal-x button{background:none; border:0; font-size:22px; line-height:1; cursor:pointer; color:var(--mist)}
.modal-x button:hover{color:var(--ink)}
.versi-blok{margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line2)}
.versi-blok:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
.versi-blok .eyebrow{margin-bottom:4px}
.versi-blok ul{margin:6px 0 0; padding-left:18px}
.versi-blok li{margin-bottom:3px; font-size:13.5px; line-height:1.5}
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(140%);
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:var(--r); z-index:100;
  transition:transform .25s ease, opacity .25s ease; font-size:14px; max-width:90vw; box-shadow:0 6px 24px rgba(0,0,0,.22);
  opacity:0; pointer-events:none;
}
.toast.on{transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto}
@media print{.topbar,.rail-beranda,.app-footer,.acts,.btn{display:none!important}}
</style>
</head>

async function masuk(){
  if(sedangProses) return;
  const email = document.getElementById("l-email").value.trim().toLowerCase();
  const sandi = document.getElementById("l-sandi").value;
  if(!email || !sandi){ toast("Isi email dan kata sandi."); return; }
  sedangProses = true;
  const tombol = document.getElementById("btn-masuk");
  tombol.disabled = true; tombol.textContent = "Memproses…";
  const { error } = await sb.auth.signInWithPassword({ email, password: sandi });
  sedangProses = false;
  if(error){
    tombol.disabled = false; tombol.textContent = "Masuk";
    toast("Gagal masuk: " + (error.message === "Invalid login credentials" ? "Email atau kata sandi salah." : error.message));
  }
}

async function kirimLupaSandi(){
  const email = document.getElementById("lp-email").value.trim().toLowerCase();
  if(!email || email.indexOf("@") < 1){ toast("Masukkan alamat email yang benar."); return; }
  const tombol = document.getElementById("btn-lupa");
  tombol.disabled = true; tombol.textContent = "Memproses…";
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  tombol.disabled = false; tombol.textContent = "Kirim tautan reset";
  if(error){ toast("Gagal mengirim: " + error.message); return; }
  toast("Kalau email itu terdaftar, tautan reset sudah dikirim.");
}

async function simpanSandiBaru(){
  const sd = document.getElementById("rs-sandi").value;
  const sd2 = document.getElementById("rs-sandi2").value;
  if(!sandiKuat(sd)){ toast("Kata sandi minimal 8 karakter dan wajib memuat huruf besar, huruf kecil, angka, dan simbol."); return; }
  if(sd !== sd2){ toast("Kata sandi dan ulangannya belum sama."); return; }
  const tombol = document.getElementById("btn-simpan-sandi");
  tombol.disabled = true; tombol.textContent = "Menyimpan…";
  const { error } = await sb.auth.updateUser({ password: sd });
  if(error){ tombol.disabled = false; tombol.textContent = "Simpan kata sandi"; toast("Gagal: " + error.message); return; }
  sesiPemulihan = false;
  toast("Kata sandi berhasil diubah.");
}

sb.auth.onAuthStateChange((event, session) => {
  if(event === "PASSWORD_RECOVERY"){ sesiPemulihan = true; tampilkanResetSandi(); return; }
  if(sesiPemulihan) return;
  if(session && session.user) muatProfilDanRender(session.user.id);
  else { profilSaya = null; akunMenuTerbuka = false; tampilkanLogin(); }
});

async function muatProfilDanRender(userId){
  const { data: profil, error } = await sb.from("profil").select("*").eq("id", userId).maybeSingle();
  if(error || !profil){ toast("Gagal memuat profil akun."); await sb.auth.signOut(); return; }
  if(profil.peran !== "admin"){
    pesanBlokir("Bukan akun Admin", "Panel ini khusus untuk akun berperan Admin. Silakan gunakan Kalender Akademik atau Logbook.");
    return;
  }
  if(profil.status_akun !== "aktif"){
    pesanBlokir("Akun belum aktif", "Akun Admin Anda belum/tidak aktif.");
    return;
  }
  profilSaya = profil;
  document.getElementById("topbarKanan").hidden = false;
  document.getElementById("siapaAktif").innerHTML = `${esc(profilSaya.nama)} &middot; Admin <i>&#9662;</i>`;
  await Promise.all([muatDaftarAkun(), muatKonten(), muatJadwal()]);
  render();
}

async function muatDaftarAkun(){
  const { data, error } = await sb.from("profil").select("*").order("dibuat", {ascending:false});
  if(error){ toast("Gagal memuat daftar akun: " + error.message); return; }
  daftarAkun = data || [];
}

async function muatKonten(){
  const { data, error } = await sb.from("konten_beranda").select("*").order("jenis").order("urutan");
  if(error){ toast("Gagal memuat konten halaman utama: " + error.message); return; }
  daftarKonten = data || [];
}

async function muatJadwal(){
  const { data, error } = await sb.from("jadwal_akademik").select("*").eq("status", "menunggu").order("tanggal", {ascending:true});
  if(error){ toast("Gagal memuat kegiatan: " + error.message); return; }
  daftarJadwal = data || [];
}

function render(){
  document.getElementById("isi").innerHTML = `
    <h1>Panel Admin</h1>
    <div class="tabs-admin">
      <button data-act="tabAkun" aria-pressed="${tabAktif==="akun"}">Akun${daftarAkun.filter(u=>u.status_akun==="menunggu").length ? `<span style="margin-left:6px; background:var(--amber); color:#fff; border-radius:99px; padding:1px 7px; font-size:11px">${daftarAkun.filter(u=>u.status_akun==="menunggu").length}</span>` : ""}</button>
      <button data-act="tabKegiatan" aria-pressed="${tabAktif==="kegiatan"}">Kegiatan${daftarJadwal.length ? `<span style="margin-left:6px; background:var(--amber); color:#fff; border-radius:99px; padding:1px 7px; font-size:11px">${daftarJadwal.length}</span>` : ""}</button>
      <button data-act="tabKonten" aria-pressed="${tabAktif==="konten"}">Kelola Halaman Utama</button>
    </div>
    ${tabAktif === "akun" ? halamanAkun() : tabAktif === "kegiatan" ? halamanKegiatan() : halamanKonten()}
  `;
}

/* ============ KEGIATAN (persetujuan kalender akademik) ============ */
function halamanKegiatan(){
  return `<div class="card">
    <div class="card-h"><h2>Menunggu Persetujuan</h2><span class="sub">${daftarJadwal.length} kegiatan</span></div>
    <div class="card-b">
      ${daftarJadwal.length ? daftarJadwal.map(j => `
        <div class="entry">
          <div class="entry-top"><h4>${esc(kegiatanByValue(j.jenis_kegiatan)?.l || j.judul_kegiatan || "Kegiatan")}</h4></div>
          <div class="meta">${fmtTanggalPendek(j.tanggal)}${j.nama_presentan ? " &middot; Presentan: " + esc(j.nama_presentan) : ""}${j.nama_pembimbing ? " &middot; Pembimbing: " + esc(j.nama_pembimbing) : ""}</div>
          <div class="meta">Diajukan oleh ${esc(j.nama_pengunggah)}</div>
          ${j.keterangan ? `<div class="meta" style="margin-top:4px">${esc(j.keterangan)}</div>` : ""}
          <div class="acts">
            <button class="btn btn-p btn-s" data-act="setujuiJadwal" data-id="${j.id}">Setujui</button>
            <button class="btn btn-d btn-s" data-act="tolakJadwal" data-id="${j.id}">Tolak</button>
          </div>
        </div>`).join("")
        : `<p class="hint">Tidak ada kegiatan yang menunggu persetujuan.</p>`}
    </div>
  </div>`;
}
async function setujuiJadwal(id){
  const { error } = await sb.from("jadwal_akademik").update({ status:"disetujui", catatan_admin:null }).eq("id", id);
  if(error){ toast("Gagal menyetujui: " + error.message); return; }
  toast("Kegiatan disetujui.");
  await muatJadwal(); render();
}
async function tolakJadwal(id){
  const alasan = prompt("Alasan penolakan (opsional):") || null;
  const { error } = await sb.from("jadwal_akademik").update({ status:"ditolak", catatan_admin: alasan }).eq("id", id);
  if(error){ toast("Gagal menolak: " + error.message); return; }
  toast("Kegiatan ditolak.");
  await muatJadwal(); render();
}

/* ============ AKUN ============ */
function halamanAkun(){
  const menunggu = daftarAkun.filter(u => u.status_akun === "menunggu");
  const aktif = daftarAkun.filter(u => u.status_akun === "aktif");
  const ditolak = daftarAkun.filter(u => u.status_akun === "ditolak");

  const kartuMenunggu = u => `<div class="entry">
    <h4>${esc(u.nama)}</h4>
    <div class="meta">${esc(u.email)} &middot; ${esc(u.nim || "-")} &middot; mengajukan sebagai ${LABEL_PERAN[u.peran] || u.peran}${u.keterangan ? " &middot; " + esc(u.keterangan) : ""}</div>
    <div class="acts">
      <select class="peran-baru" data-id="${u.id}" style="width:auto; padding:5px 8px">
        ${Object.keys(LABEL_PERAN).map(k => `<option value="${k}" ${k===u.peran?"selected":""}>${LABEL_PERAN[k]}</option>`).join("")}
      </select>
      <button class="btn btn-p btn-s" data-act="setujuiAkun" data-id="${u.id}">Setujui</button>
      <button class="btn btn-d btn-s" data-act="tolakAkun" data-id="${u.id}">Tolak</button>
    </div>
  </div>`;

  const kartuAktif = u => `<div class="entry">
    <div class="entry-top"><span class="pill p-ver">${LABEL_PERAN[u.peran] || u.peran}</span>${u.id===profilSaya.id ? `<span class="muted" style="font-size:12.5px; color:var(--mist)">akun Anda</span>` : ""}</div>
    <h4>${esc(u.nama)}</h4>
    <div class="meta">${esc(u.email)}${u.keterangan ? " &middot; " + esc(u.keterangan) : ""}</div>
    ${u.id===profilSaya.id ? "" : `<div class="acts">
      ${(profilSaya.super_admin && u.peran!=="admin") ? `<button class="btn btn-o btn-s" data-act="jadikanAdmin" data-id="${u.id}">Jadikan Admin</button>` : ""}
      <button class="btn btn-d btn-s" data-act="nonaktifkanAkun" data-id="${u.id}">Nonaktifkan</button>
    </div>`}
  </div>`;

  const kartuDitolak = u => `<div class="entry">
    <h4>${esc(u.nama)}</h4>
    <div class="meta">${esc(u.email)}</div>
    <div class="acts"><button class="btn btn-o btn-s" data-act="aktifkanAkun" data-id="${u.id}">Aktifkan kembali</button></div>
  </div>`;

  return `
  ${menunggu.length ? `<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Menunggu Persetujuan</h2><span class="sub">${menunggu.length} akun</span></div>
    <div class="card-b">${menunggu.map(kartuMenunggu).join("")}</div></div>` : ""}
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Akun aktif</h2><span class="sub">${aktif.length} akun</span></div>
    <div class="card-b">${aktif.length ? aktif.map(kartuAktif).join("") : `<div class="empty"><b>Belum ada</b></div>`}</div></div>
  ${ditolak.length ? `<div class="card"><div class="card-h"><h2>Tidak aktif</h2><span class="sub">${ditolak.length} akun</span></div>
    <div class="card-b">${ditolak.map(kartuDitolak).join("")}</div></div>` : ""}`;
}

async function setujuiAkun(id){
  const sel = document.querySelector(`.peran-baru[data-id="${id}"]`);
  const peranBaru = sel ? sel.value : undefined;
  const payload = { status_akun: "aktif" };
  if(peranBaru) payload.peran = peranBaru;
  const { error } = await sb.from("profil").update(payload).eq("id", id);
  if(error){ toast("Gagal menyetujui: " + error.message); return; }
  toast("Akun disetujui.");
  await muatDaftarAkun(); render();
}
async function tolakAkun(id){
  const { error } = await sb.from("profil").update({ status_akun: "ditolak" }).eq("id", id);
  if(error){ toast("Gagal menolak: " + error.message); return; }
  toast("Akun ditolak.");
  await muatDaftarAkun(); render();
}
async function nonaktifkanAkun(id){
  if(!confirm("Nonaktifkan akun ini?")) return;
  const { error } = await sb.from("profil").update({ status_akun: "ditolak" }).eq("id", id);
  if(error){ toast("Gagal menonaktifkan: " + error.message); return; }
  toast("Akun dinonaktifkan.");
  await muatDaftarAkun(); render();
}
async function aktifkanAkun(id){
  const { error } = await sb.from("profil").update({ status_akun: "aktif" }).eq("id", id);
  if(error){ toast("Gagal mengaktifkan: " + error.message); return; }
  toast("Akun diaktifkan kembali.");
  await muatDaftarAkun(); render();
}
async function jadikanAdmin(id){
  if(!confirm("Jadikan akun ini Admin?")) return;
  const { error } = await sb.from("profil").update({ peran: "admin" }).eq("id", id);
  if(error){ toast("Gagal mengubah peran: " + error.message); return; }
  toast("Akun sekarang Admin.");
  await muatDaftarAkun(); render();
}

/* ============ KELOLA HALAMAN UTAMA ============ */
function halamanKonten(){
  const daftar = daftarKonten.filter(k => k.jenis === kontenJenis).sort((a,b) => a.urutan - b.urutan);
  return `
  <p class="hint" style="margin:0 0 12px">Konten di sini tampil publik di halaman utama (index.html), tanpa perlu login.</p>
  <div class="tabs-admin">${Object.keys(LABEL_JENIS_KONTEN).map(j =>
    `<button data-act="filterKonten" data-j="${j}" aria-pressed="${kontenJenis===j}">${LABEL_JENIS_KONTEN[j]}</button>`).join("")}</div>
  ${formKonten()}
  <div class="card" style="margin-top:16px"><div class="card-h"><h2>Daftar ${esc(LABEL_JENIS_KONTEN[kontenJenis])}</h2>
    <span class="sub">${daftar.length} item</span></div>
    <div class="card-b">${daftar.length ? daftar.map(kartuKonten).join("") : `<div class="empty"><b>Belum ada</b>Tambahkan lewat formulir di atas.</div>`}</div>
  </div>`;
}

function formKonten(){
  const e = editKontenId ? daftarKonten.find(k => k.id === editKontenId) : null;
  const untukBerita = kontenJenis === "berita";
  return `<div class="card"><div class="card-h"><h2>${e ? "Ubah" : "Tambah"} ${esc(LABEL_JENIS_KONTEN[kontenJenis])}</h2></div>
    <div class="card-b">
      <div class="grid g2">
        <div class="field"><label>${untukBerita?"Judul berita":"Nama lengkap"}</label>
          <input type="text" id="k-judul" value="${esc(e?e.judul:"")}"></div>
        <div class="field"><label>${untukBerita ? "Ringkasan singkat (opsional)" : "Sub-judul / jabatan / angkatan (opsional)"}</label>
          <input type="text" id="k-subjudul" value="${esc(e?e.subjudul||"":"")}"></div>
      </div>
      <div class="field"><label>Foto / gambar -- tautan URL (opsional)</label>
        <input type="text" id="k-foto" value="${esc(e?e.foto||"":"")}" placeholder="https://..."></div>
      <div class="field"><label>${untukBerita ? "Isi berita" : "Deskripsi"}</label>
        <textarea id="k-isi" placeholder="Opsional">${esc(e?e.isi||"":"")}</textarea></div>
      <div class="grid g2">
        <div class="field"><label>Urutan tampil</label><input type="number" id="k-urutan" value="${e?e.urutan:0}"></div>
        <div class="field"><label>Status</label>
          <select id="k-status">
            <option value="aktif" ${(!e||e.status==="aktif")?"selected":""}>Aktif (tampil di halaman utama)</option>
            <option value="nonaktif" ${e&&e.status==="nonaktif"?"selected":""}>Nonaktif (disembunyikan)</option>
          </select></div>
      </div>
      <div class="acts">
        <button class="btn btn-p" data-act="simpanKonten">${e ? "Simpan perubahan" : "Tambahkan"}</button>
        ${e ? `<button class="btn btn-o" data-act="batalUbahKonten">Batal</button>` : ""}
      </div>
    </div>
  </div>`;
}

function kartuKonten(k){
  return `<div class="entry">
    <div class="entry-top">
      <span class="pill ${k.status==="aktif"?"p-ver":"p-draft"}">${k.status==="aktif"?"Aktif":"Nonaktif"}</span>
      <span class="meta" style="font-size:12.5px">Urutan ${k.urutan}</span>
    </div>
    <h4>${esc(k.judul)}</h4>
    ${k.subjudul ? `<div class="meta">${esc(k.subjudul)}</div>` : ""}
    ${k.isi ? `<div class="meta" style="margin-top:5px">${esc(k.isi)}</div>` : ""}
    <div class="acts">
      <button class="btn btn-o btn-s" data-act="ubahKonten" data-id="${k.id}">Ubah</button>
      <button class="btn btn-o btn-s" data-act="toggleStatusKonten" data-id="${k.id}">${k.status==="aktif"?"Nonaktifkan":"Aktifkan"}</button>
      <button class="btn btn-d btn-s" data-act="hapusKonten" data-id="${k.id}">Hapus</button>
    </div>
  </div>`;
}

async function simpanKonten(){
  const judul = document.getElementById("k-judul").value.trim();
  if(!judul){ toast("Judul wajib diisi."); return; }
  const payload = {
    jenis: kontenJenis, judul,
    subjudul: document.getElementById("k-subjudul").value.trim() || null,
    foto: document.getElementById("k-foto").value.trim() || null,
    isi: document.getElementById("k-isi").value.trim() || null,
    urutan: Number(document.getElementById("k-urutan").value) || 0,
    status: document.getElementById("k-status").value
  };
  if(editKontenId){
    const { error } = await sb.from("konten_beranda").update(payload).eq("id", editKontenId);
    if(error){ toast("Gagal menyimpan: " + error.message); return; }
    toast("Perubahan disimpan.");
  } else {
    payload.dibuat_oleh = profilSaya.id;
    const { error } = await sb.from("konten_beranda").insert(payload);
    if(error){ toast("Gagal menambahkan: " + error.message); return; }
    toast("Ditambahkan.");
  }
  editKontenId = null;
  await muatKonten(); render();
}
async function toggleStatusKonten(id){
  const k = daftarKonten.find(x => x.id === id);
  if(!k) return;
  const statusBaru = k.status === "aktif" ? "nonaktif" : "aktif";
  const { error } = await sb.from("konten_beranda").update({ status: statusBaru }).eq("id", id);
  if(error){ toast("Gagal mengubah status: " + error.message); return; }
  toast(statusBaru==="aktif" ? "Diaktifkan." : "Dinonaktifkan.");
  await muatKonten(); render();
}
async function hapusKonten(id){
  if(!confirm("Hapus item ini dari halaman utama?")) return;
  const { error } = await sb.from("konten_beranda").delete().eq("id", id);
  if(error){ toast("Gagal menghapus: " + error.message); return; }
  toast("Dihapus.");
  await muatKonten(); render();
}

// Riwayat versi ditampilkan lewat footer (klik nomor versi) dan lewat popup
// "Ada pembaruan" otomatis saat versi berubah (sekali saja per versi, lewat
// localStorage). Berisi perubahan khusus Admin (Panel Admin ini) -- perubahan
// yang terasa oleh PPDS/P3D dicatat di changelog Logbook/Kalender Akademik.
// Versi terbaru di paling atas. Tambahkan blok baru setiap versi dinaikkan.
const APP_VERSION = "1.0.0";
const RIWAYAT_VERSI = [
  {v:"1.0.0", catatan:[
    "Rilis awal Panel Admin: kelola Akun (persetujuan, aktif/nonaktif, jadikan Admin) dan Kelola Halaman Utama (berita, alumni, profil pengajar), terpisah dari Logbook",
    "Tab Kegiatan: Setujui/Tolak pengajuan kegiatan Kalender Akademik langsung dari Panel Admin -- begitu Logbook dibuka, kegiatan yang disetujui & sudah terlaksana otomatis masuk sebagai entri logbook",
    "Tombol navigasi langsung ke Kalender Akademik dan Logbook"
  ]}
];

function tampilkanRiwayatVersi(hanyaTerbaru){
  const daftar = hanyaTerbaru ? [RIWAYAT_VERSI[0]] : RIWAYAT_VERSI;
  document.getElementById("isiModalVersi").innerHTML = `
    <h2 style="margin-bottom:2px">${hanyaTerbaru ? "Ada pembaruan!" : "Riwayat Versi"}</h2>
    <p class="muted" style="font-size:13px; margin:0 0 16px">Panel Admin Radiologi FK USU</p>
    ${daftar.map(r => `<div class="versi-blok">
      <div class="eyebrow">Versi ${esc(r.v)}</div>
      <ul>${r.catatan.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    </div>`).join("")}
    ${hanyaTerbaru ? `<button class="btn btn-p" data-act="tutupModalVersi" style="width:100%; margin-top:6px">Mengerti</button>` : ""}
  `;
  document.getElementById("modalVersi").hidden = false;
}

document.getElementById("teksVersi").textContent = APP_VERSION;
document.getElementById("tautanVersi").addEventListener("click", () => tampilkanRiwayatVersi(false));

try{
  const versiTerlihat = localStorage.getItem("adminPanelVersiTerlihat");
  if(versiTerlihat !== APP_VERSION){
    tampilkanRiwayatVersi(true);
    localStorage.setItem("adminPanelVersiTerlihat", APP_VERSION);
  }
}catch(e){}

document.addEventListener("click", ev => {
  if(ev.target && (ev.target.id === "modalVersi" || ev.target.closest('[data-act="tutupModalVersi"]'))){
    document.getElementById("modalVersi").hidden = true;
    return;
  }
  const akunBtn = ev.target.closest("[data-act]");
  if(akunBtn && akunBtn.dataset.act === "toggleAkunMenu"){
    akunMenuTerbuka = !akunMenuTerbuka;
    document.getElementById("akunMenu").hidden = !akunMenuTerbuka;
    return;
  }
  if(akunBtn && akunBtn.dataset.act === "keluar"){ sb.auth.signOut(); return; }
  if(akunMenuTerbuka && !ev.target.closest(".akun-dropdown")){
    akunMenuTerbuka = false;
    document.getElementById("akunMenu").hidden = true;
  }
  const b = ev.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if(act === "modeMasuk"){ modeAuth = "masuk"; tampilkanLogin(); return; }
  if(act === "modeLupa"){ modeAuth = "lupa"; tampilkanLogin(); return; }
  if(act === "tabAkun"){ tabAktif = "akun"; render(); return; }
  if(act === "tabKegiatan"){ tabAktif = "kegiatan"; render(); return; }
  if(act === "tabKonten"){ tabAktif = "konten"; render(); return; }
  if(act === "setujuiAkun") setujuiAkun(id);
  if(act === "tolakAkun") tolakAkun(id);
  if(act === "nonaktifkanAkun") nonaktifkanAkun(id);
  if(act === "aktifkanAkun") aktifkanAkun(id);
  if(act === "jadikanAdmin") jadikanAdmin(id);
  if(act === "setujuiJadwal") setujuiJadwal(id);
  if(act === "tolakJadwal") tolakJadwal(id);
  if(act === "filterKonten"){ kontenJenis = b.dataset.j; editKontenId = null; render(); return; }
  if(act === "ubahKonten"){ editKontenId = id; render(); window.scrollTo({top:0, behavior:"instant"}); return; }
  if(act === "batalUbahKonten"){ editKontenId = null; render(); return; }
  if(act === "simpanKonten") simpanKonten();
  if(act === "toggleStatusKonten") toggleStatusKonten(id);
  if(act === "hapusKonten") hapusKonten(id);
});

tampilkanLogin();
</script>
</body>
</html>
