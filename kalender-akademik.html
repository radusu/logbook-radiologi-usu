<style>
:root{
  --ink:#101418; --ink2:#1B2229; --graphite:#4B565F; --mist:#8A959D;
  --line:#D9DEE1; --line2:#EDF0F1; --paper:#F1F3F2; --card:#FFFFFF;
  --usu:#0A6E3C; --usu-deep:#04512A; --usu-soft:#E6F1EA;
  --amber:#96600A; --amber-soft:#FBF0DC; --rust:#9C3826; --rust-soft:#FAE9E5; --danger:#9C3826;
  --r:12px;
  --f-disp:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55}
h1,h2{font-family:var(--f-disp); font-weight:600; margin:0; letter-spacing:-.01em}
a{color:var(--usu)}
button,input{font-family:inherit; font-size:inherit; color:inherit}

.topbar{background:var(--ink); color:#fff; border-bottom:1px solid #000}
.topbar-in{max-width:1120px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto}
.brand span{min-width:0}
.jam-beranda{font-family:var(--f-mono); font-weight:600; font-size:32px; color:var(--usu-deep); white-space:nowrap; letter-spacing:-.01em; line-height:1; text-align:right}
.tanggal-beranda{font-family:var(--f-mono); font-size:12px; color:var(--usu-deep); opacity:.7; white-space:nowrap; text-align:right; margin-top:3px}
@media (max-width:480px){.jam-beranda, .tanggal-beranda{display:none}}
.kartu-sapaan{background:var(--usu-soft); border-color:var(--usu-soft); margin:10px 0 16px; padding:16px 18px; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px}
.kartu-sapaan:not([hidden]){display:flex}
.topbar b{font-family:var(--f-disp); font-weight:700; font-size:16px; letter-spacing:.01em; display:block; line-height:1.1}
.logo{width:32px; height:32px; display:block; flex:0 0 32px}
.topbar small{font-family:var(--f-mono); font-size:9.5px; color:#8A959D; letter-spacing:.14em; text-transform:uppercase; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar-kanan{display:flex; align-items:center; gap:14px; font-size:13px; color:#C7CDD1; flex:0 0 auto}
.topbar-kanan[hidden]{display:none}
.topbar-kanan a{color:#fff}
.akun-dropdown{position:relative}
.akun-tombol{
  background:none; border:1px solid #38424A; color:#fff; border-radius:var(--r);
  padding:6px 11px; cursor:pointer; font-family:var(--f-mono); font-size:13px;
  display:flex; align-items:center; gap:7px;
}
.akun-tombol:hover{background:#1B2229}
.akun-tombol i{font-style:normal; color:#8A959D; font-size:10px}
.akun-menu{
  position:absolute; right:0; top:calc(100% + 6px); min-width:170px;
  background:#1B2229; border:1px solid #38424A; border-radius:var(--r);
  box-shadow:0 8px 24px rgba(0,0,0,.35); overflow:hidden; z-index:60;
}
.akun-menu[hidden]{display:none}
.akun-menu button{
  display:block; width:100%; text-align:left; background:none; border:0; color:#fff;
  padding:10px 13px; font-size:13px; cursor:pointer; font-family:var(--f-body);
}
.akun-menu button:hover{background:#252d35}
.rail-tabs{
  position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:70;
  display:flex; flex-direction:column;
}
.rail-tabs a{
  color:#fff; text-decoration:none;
  font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  padding:16px 8px; border:1px solid #000; border-right:0; border-bottom:0;
  writing-mode:vertical-rl; text-orientation:mixed;
  box-shadow:-4px 0 14px rgba(0,0,0,.2);
}
.rail-tabs a:last-child{border-bottom:1px solid #000}
.rail-tabs a:first-child{border-radius:var(--r) 0 0 0}
.rail-tabs a:last-child{border-radius:0 0 0 var(--r)}
.rail-beranda{background:var(--ink)}
.rail-beranda:hover{background:#1B2229}
.rail-logbook{background:var(--usu-deep)}
.rail-logbook:hover{background:#04512A}
@media (max-width:640px){.rail-tabs a{padding:12px 6px; font-size:10px}}

main{max-width:820px; margin:0 auto; padding:26px 20px 70px; transition:max-width .15s}
main.lebar{max-width:1120px}
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--usu-deep)}
main > h1{font-size:22px; margin:6px 0 20px}

.pra-masuk{display:grid; grid-template-columns:360px 700px; gap:24px; align-items:start; width:fit-content; margin:0 auto}
.pra-masuk > *{min-width:0; max-width:100%; overflow-wrap:break-word}
@media (max-width:1120px){.pra-masuk{grid-template-columns:1fr; width:100%; max-width:500px}}

.kal-2kolom{display:grid; grid-template-columns:360px 1fr; gap:24px; align-items:start}
.kal-2kolom > *{min-width:0}
@media (max-width:900px){.kal-2kolom{grid-template-columns:1fr}}

body.bg-foto{background:linear-gradient(rgba(9,12,15,.72),rgba(9,12,15,.72)), url("fk_wallpaper.webp") center/cover no-repeat}
body.bg-foto main > h1{color:#fff}
body.bg-foto .login-box .card{
  background:rgba(255,255,255,.8); border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 12px 40px rgba(0,0,0,.35);
}
body.bg-foto .login-box h1{color:var(--ink)}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 4px 14px rgba(16,20,24,.05); overflow:hidden}
.card-h{padding:13px 16px; border-bottom:1px solid var(--line2); background:var(--paper); display:flex; justify-content:space-between; align-items:center; gap:10px}
.card-h h2{font-size:16px}
.card-h .sub{font-size:12.5px; color:var(--mist)}
.card-b{padding:16px 18px}

.field{margin-bottom:13px}
.field label{display:block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--graphite); margin-bottom:5px}
.field input, .field select{width:100%; border:1px solid var(--line); border-radius:var(--r); padding:9px 11px; background:#fff}
.field input:focus, .field select:focus{outline:2px solid var(--usu); outline-offset:1px}
.hint{font-size:11.5px; color:var(--mist); margin-top:4px}

.btn{display:inline-block; border:1px solid transparent; border-radius:var(--r); padding:9px 16px; font-family:var(--f-disp); font-weight:600; font-size:13.5px; cursor:pointer}
.btn-p{background:var(--usu); color:#fff}
.btn-p:hover{background:#0c8449}
.btn-o{background:#fff; border-color:var(--line); color:var(--ink2)}
.btn-o:hover{background:var(--line2)}
.btn-d{background:#fff; border-color:var(--line); color:var(--danger)}
.btn-d:hover{background:#FBEAE7}
.btn-s{padding:6px 12px; font-size:12.5px}
.btn[disabled]{opacity:.55; cursor:default}

.baris-jadwal{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; padding:13px 0; border-bottom:1px solid var(--line2); flex-wrap:wrap}
.baris-jadwal:last-child{border-bottom:0}
.pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px; font-family:var(--f-mono); white-space:nowrap}
.muted{color:var(--mist)}
.empty{padding:26px 10px; text-align:center; color:var(--mist)}
.empty b{display:block; color:var(--ink2); margin-bottom:4px; font-family:var(--f-disp)}

.kal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.kal-head b{font-size:15px; font-family:var(--f-disp)}
.kal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.kal-dow{text-align:center; font-family:var(--f-mono); font-size:9.5px; color:var(--mist); padding:4px 0 6px; text-transform:uppercase}
.kal-sel{aspect-ratio:1; border:1px solid var(--line2); border-radius:var(--r); background:#fff; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:2px}
.kal-sel:hover{background:var(--line2)}
.kal-kosong{border:0; background:transparent; cursor:default}
.kal-angka{font-size:12.5px}
.kal-ini .kal-angka{font-weight:700; color:var(--usu-deep)}
.kal-aktif{background:var(--usu); border-color:var(--usu)}
.kal-aktif .kal-angka{color:#fff}
.kal-kodewrap{display:flex; gap:2px; flex-wrap:wrap; justify-content:center; max-width:100%; min-height:12px}
.kal-kode{font-size:7.5px; font-family:var(--f-mono); font-weight:700; padding:0 3px; border-radius:2px; line-height:1.6; white-space:nowrap}

.pesan-blokir{max-width:420px; margin:80px auto; text-align:center; padding:0 20px}
.pesan-blokir h1{font-size:20px; margin-bottom:10px}
.pesan-blokir p{color:var(--graphite); font-size:14px; margin-bottom:18px}

.login-box{max-width:380px; margin:24px auto 0; padding:0 20px 40px}
.pra-masuk .login-box{max-width:none; margin:0; padding:0}
.login-box .card-b{padding:22px 22px 24px}
.login-box h1{font-size:20px; margin-bottom:6px; text-align:center}
.login-logo{width:66px; height:66px; margin:0 auto 12px; display:block}
.login-box .sub-login{color:var(--graphite); font-size:13.5px; text-align:center; margin-bottom:22px}
.login-box .hint-daftar{text-align:center; font-size:13px; color:var(--graphite); margin-top:16px}
.tabs-auth{display:flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-bottom:20px}
.tabs-auth button{flex:1; background:#fff; border:0; padding:9px; cursor:pointer; font-size:14px; font-family:var(--f-disp); font-weight:600}
.tabs-auth button[aria-pressed="true"]{background:var(--ink); color:#fff}
.login-box select{width:100%; border:1px solid var(--line); border-radius:var(--r); padding:9px 11px; background:#fff}

.tabs-admin{display:flex; align-items:center; gap:6px; margin-bottom:16px}
.tabs-admin button{display:inline-flex; align-items:center; height:36px; box-sizing:border-box; background:#fff; border:1px solid var(--line); border-radius:99px; padding:0 16px; cursor:pointer; font-size:13.5px; font-family:var(--f-disp); font-weight:600; color:var(--ink2)}
.tabs-admin button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.tabs-admin .badge{font-family:var(--f-mono); font-size:10px; background:var(--amber); color:#fff; border-radius:99px; padding:1px 6px; margin-left:6px}

.app-footer{
  position:fixed; left:0; right:0; bottom:0; z-index:65;
  background:rgba(16,20,24,.85); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  padding:7px 16px; text-align:center;
  font-family:var(--f-mono); font-size:10.5px; color:#C7CDD1; letter-spacing:.04em;
}
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(140%);
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:var(--r); z-index:100;
  transition:transform .25s ease, opacity .25s ease; font-size:14px; max-width:90vw; box-shadow:0 6px 24px rgba(0,0,0,.22);
  opacity:0; pointer-events:none;
}
.toast.on{transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto}
.modal-bg{
  position:fixed; inset:0; background:rgba(9,12,15,.6); z-index:120;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-bg[hidden]{display:none}
.modal-box{
  background:#fff; border-radius:var(--r); max-width:480px; width:100%; max-height:80vh;
  overflow-y:auto; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.35); position:relative;
}
.modal-x{position:sticky; top:-24px; text-align:right; margin:-24px -24px 0; padding:10px 14px 0}
.modal-x button{background:none; border:0; font-size:22px; line-height:1; cursor:pointer; color:var(--mist)}
.modal-x button:hover{color:var(--ink)}
.versi-blok{margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line2)}
.versi-blok:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
.versi-blok .eyebrow{margin-bottom:4px}
.versi-blok ul{margin:6px 0 0; padding-left:18px}
.versi-blok li{margin-bottom:3px; font-size:13.5px; line-height:1.5}
</style>
</head>

// Supabase mengirim pesan error lewat fragment URL (#error=...) kalau tautan
// verifikasi/reset kata sandi sudah kedaluwarsa, sudah dipakai, atau tidak
// valid. Tanpa ini, halaman diam-diam kembali ke layar Masuk tanpa
// penjelasan apa pun ke pengguna.
if(window.location.hash.includes("error=")){
  const param = new URLSearchParams(window.location.hash.slice(1));
  const kode = param.get("error_code");
  if(kode === "otp_expired"){
    toast("Tautan sudah kedaluwarsa atau sudah pernah dipakai. Silakan minta tautan baru lewat \"Lupa kata sandi?\".");
  } else {
    toast("Tautan tidak valid: " + (param.get("error_description") || kode || "kesalahan tidak diketahui").replace(/\+/g, " "));
  }
  history.replaceState(null, "", window.location.pathname);
}

let modeAuth = "masuk";        // "masuk", "daftar", atau "lupa"

let tabAdmin = "kalender";     // "kalender" atau "menunggu" (khusus Admin/Tenaga Pendidik)
let tabUtama = "kalender";     // "kalender", "langganan", atau "profil"
let akunMenuTerbuka = false;   // dropdown nama akun di pojok kanan atas
let sedangEdit = null;         // id kegiatan yang sedang diubah Admin/Tenaga Pendidik
let tabKalenderDalam = "kalender"; // "kalender" atau "morningReport" -- sub-tab di dalam kartu "Kalender kegiatan"

// Isi kartu "Kalender kegiatan" tergantung sub-tab yang aktif: kegiatan biasa
// (selalu tanpa Morning Report, supaya tidak penuh) atau khusus Morning Report.
function daftarJadwalTampil(){
  return tabKalenderDalam === "morningReport"
    ? daftarJadwal.filter(j => j.jenis_kegiatan === "morning_report")
    : daftarJadwal.filter(j => j.jenis_kegiatan !== "morning_report");
}

function tabsKalenderDalam(){
  return `<div class="tabs-admin" style="margin-bottom:14px">
    <button data-act="tabKalDalamKalender" aria-pressed="${tabKalenderDalam==="kalender"}">Kalender</button>
    <button data-act="tabKalDalamMR" aria-pressed="${tabKalenderDalam==="morningReport"}">Morning Report</button>
  </div>`;
}

// Morning Report ditampilkan sebagai daftar biasa (bukan grid kalender) --
// lebih enak dibaca. Tombol "Ubah" per baris sudah otomatis tersedia untuk
// Admin lewat barisJadwal(), tidak perlu komponen terpisah.
function seninMinggu(d){
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // mundur ke Senin
  x.setHours(0, 0, 0, 0);
  return x;
}

function barisMRRingkas(j, fmtSingkat){
  if(sedangEdit === j.id) return formUbahJadwal(j);
  const bisaUbah = bisaModerasi();
  const bisaHapus = profilSaya && (profilSaya.id === j.user_id || profilSaya.peran === "admin");
  return `<div style="display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line2); font-size:13.5px">
    <span class="mono" style="flex:0 0 auto; min-width:64px; color:var(--graphite)">${fmtSingkat(j.tanggal)}</span>
    <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(j.nama_pembimbing || "—")}</span>
    ${bisaUbah ? `<button class="btn btn-o btn-s" data-act="ubahJadwal" data-id="${j.id}" style="padding:3px 9px; font-size:12px; flex:0 0 auto">Ubah</button>` : ""}
    ${bisaHapus ? `<button class="btn btn-d btn-s" data-act="hapus" data-id="${j.id}" style="padding:3px 9px; font-size:12px; flex:0 0 auto">Hapus</button>` : ""}
  </div>`;
}

// Morning Report ditampilkan sebagai daftar ringkas dikelompokkan per minggu
// (Senin-Minggu), satu baris per tanggal -- supaya tidak terasa menumpuk.
function renderDaftarMR(){
  const kunci = bulanTampil.getFullYear() + "-" + String(bulanTampil.getMonth()+1).padStart(2, "0");
  const daftar = daftarJadwal
    .filter(j => j.jenis_kegiatan === "morning_report" && j.tanggal.slice(0, 7) === kunci)
    .sort((a, b) => a.tanggal.localeCompare(b.tanggal));
  const bulanLabel = bulanTampil.toLocaleDateString("id-ID", {month:"long", year:"numeric"});

  const grup = {};
  daftar.forEach(j => {
    const kunciMinggu = toISO(seninMinggu(new Date(j.tanggal + "T00:00:00")));
    (grup[kunciMinggu] = grup[kunciMinggu] || []).push(j);
  });
  const mingguUrut = Object.keys(grup).sort();
  const fmtSingkat = iso => new Date(iso + "T00:00:00").toLocaleDateString("id-ID", {weekday:"short", day:"numeric", month:"short"});
  const fmtRentang = kunciMinggu => {
    const awal = new Date(kunciMinggu + "T00:00:00");
    const akhir = new Date(awal); akhir.setDate(akhir.getDate() + 6);
    const opt = {day:"numeric", month:"short"};
    return `${awal.toLocaleDateString("id-ID", opt)} – ${akhir.toLocaleDateString("id-ID", opt)}`;
  };

  return `
  <div class="kal-head">
    <button class="btn btn-o btn-s" data-act="bulanSebelum">&larr;</button>
    <b>${bulanLabel}</b>
    <button class="btn btn-o btn-s" data-act="bulanBerikut">&rarr;</button>
  </div>
  <div style="margin-top:10px">
    ${mingguUrut.length ? mingguUrut.map((kunciMinggu, i) => `
      <div class="eyebrow" style="margin:14px 0 4px">Minggu ${i+1} &middot; ${fmtRentang(kunciMinggu)}</div>
      ${grup[kunciMinggu].map(j => barisMRRingkas(j, fmtSingkat)).join("")}
    `).join("")
      : `<div class="empty"><b>Tidak ada jadwal</b>Belum ada Morning Report bulan ini.</div>`}
  </div>`;
}

let draftRiwayat = null;       // riwayat pendidikan yang sedang disunting di tab Profil Saya

let sedangProses = false;

const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
let bulanTampil = (() => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
let tanggalDipilih = toISO(new Date());
const HARI_SINGKAT = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];

function sandiKuat(s){
  return s.length >= 8 && /[a-z]/.test(s) && /[A-Z]/.test(s) && /[0-9]/.test(s) && /[^A-Za-z0-9]/.test(s);
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[c]));

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 3200);
}

function sapaWaktu(){
  const j = new Date().getHours();
  if(j < 11) return "Selamat pagi";
  if(j < 15) return "Selamat siang";
  if(j < 19) return "Selamat sore";
  return "Selamat malam";
}
function teksJamSaja(){
  return new Date().toLocaleTimeString("id-ID",{hour:"2-digit", minute:"2-digit", second:"2-digit"});
}
function teksTanggalSaja(){
  return new Date().toLocaleDateString("id-ID",{weekday:"long", day:"2-digit", month:"long", year:"numeric"});
}
function jamHidupTick(){
  const bel = document.getElementById("jamBeranda");
  if(bel) bel.textContent = teksJamSaja();
  const tel = document.getElementById("tanggalBeranda");
  if(tel) tel.textContent = teksTanggalSaja();
}
jamHidupTick();
setInterval(jamHidupTick, 1000);
const GELAR_DEPAN = new Set(["dr.","dr","drg.","drg","prof.","prof"]);
function namaDepan(nama){
  const kata = String(nama || "").trim().split(/\s+/).filter(Boolean);
  let i = 0;
  while(i < kata.length - 1 && GELAR_DEPAN.has(kata[i].toLowerCase())) i++;
  return kata[i] || nama || "";
}
function labelPeran(p){
  return {ppds:"Peserta PPDS", p3d:"Mahasiswa P3D", supervisor:"Supervisor / DPJP",
    admin:"Admin"}[p] || p;
}

function fmtTanggalPendek(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}

function bisaUnggah(){
  return profilSaya && (profilSaya.peran === "ppds" || profilSaya.peran === "admin");

async function kirimLupaSandi(){
  const email = (document.getElementById("lp-email").value || "").trim().toLowerCase();
  if(!email || email.indexOf("@") < 1){ toast("Masukkan alamat email yang benar."); return; }
  const tombol = document.getElementById("btn-lupa");
  tombol.disabled = true; tombol.textContent = "Memproses…";
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error){
    tombol.disabled = false; tombol.textContent = "Kirim tautan reset";
    toast("Gagal mengirim tautan: " + error.message);
    return;
  }
  modeAuth = "masuk";
  tampilkanLogin();
  toast("Jika email terdaftar, tautan reset kata sandi sudah dikirim. Cek kotak masuk / folder spam.");
}

async function masuk(){
  const email = (document.getElementById("l-email").value || "").trim().toLowerCase();
  const sandi = document.getElementById("l-sandi").value || "";
  if(!email || !sandi){ toast("Isi email dan kata sandi."); return; }
  const tombol = document.getElementById("btn-masuk");
  tombol.disabled = true; tombol.textContent = "Memproses…";
  const { error } = await sb.auth.signInWithPassword({ email, password: sandi });
  if(error){
    tombol.disabled = false; tombol.textContent = "Masuk";
    toast("Email atau kata sandi salah.");
    return;
  }
  // onAuthStateChange akan mengambil alih dan merender halaman kalender.
}

async function daftarAkun(){
  if(sedangProses) return;
  const n = document.getElementById("d-nama").value.trim();
  const em = document.getElementById("d-email").value.trim().toLowerCase();
  const nim = document.getElementById("d-nim").value.trim();
  const peranDipilih = document.getElementById("d-peran").value;
  const sd = document.getElementById("d-sandi").value;
  const sd2 = document.getElementById("d-sandi2").value;
  if(!n){ toast("Nama lengkap wajib diisi."); return; }
  if(!em || em.indexOf("@") < 1){ toast("Masukkan alamat email yang benar."); return; }
  let ket = null;
  if(peranDipilih === "ppds"){
    const smt = document.getElementById("d-semester").value;
    if(!smt){ toast("Pilih semester saat ini."); return; }
    ket = "Semester " + smt;
  }
  if(!sandiKuat(sd)){ toast("Kata sandi minimal 8 karakter dan wajib memuat huruf besar, huruf kecil, angka, dan simbol."); return; }
  if(sd !== sd2){ toast("Kata sandi dan ulangannya belum sama."); return; }

  sedangProses = true;
  const tombol = document.getElementById("btn-daftar");
  tombol.disabled = true; tombol.textContent = "Memproses…";
  const { error } = await sb.auth.signUp({
    email: em, password: sd,
    options: { data: { nama: n, nim: nim || null, peran: peranDipilih, keterangan: ket } }
  });
  sedangProses = false;
  if(error){
    tombol.disabled = false; tombol.textContent = "Ajukan pendaftaran";
    toast(error.message === "User already registered" ? "Email ini sudah terdaftar." : "Pendaftaran gagal: " + error.message);
    return;
  }
  modeAuth = "masuk"; daftarPeranKalender = "ppds";
  tampilkanLogin();
  toast("Pendaftaran terkirim. Menunggu persetujuan Admin.");
}

async function muatProfilDanRender(userId){
  const { data: profil, error } = await sb.from("profil").select("*").eq("id", userId).maybeSingle();
  if(error || !profil){
    toast("Gagal memuat data akun.");
    await sb.auth.signOut();
    return;
  }
  if(profil.status_akun !== "aktif"){
    pesanBlokir("Akun belum aktif", "Pendaftaran Anda belum atau tidak disetujui, jadi belum bisa membuka Kalender Akademik.");
    return;
  }
  profilSaya = profil;
  document.querySelector(".topbar").style.display = "";
  document.getElementById("topbarKanan").hidden = false;
  document.querySelector("main").classList.add("lebar");
  document.body.classList.remove("bg-foto");
  document.getElementById("judulUtama").hidden = false;
  document.getElementById("sapaanKalender").hidden = false;
  document.getElementById("sapaanNama").textContent = `${sapaWaktu()}, ${namaDepan(profil.nama)}`;
  perbaruiTombolAkun();
  await muatJadwal();
  render();
}

async function simpanSandiBaruKalender(){
  const sd = document.getElementById("rs-sandi").value;

  if(!sandiKuat(sd)){ toast("Kata sandi minimal 8 karakter dan wajib memuat huruf besar, huruf kecil, angka, dan simbol."); return; }
  if(sd !== sd2){ toast("Kata sandi dan ulangannya belum sama."); return; }
  const tombol = document.getElementById("btn-simpan-sandi");
  tombol.disabled = true; tombol.textContent = "Menyimpan…";
  const { error } = await sb.auth.updateUser({ password: sd });
  if(error){
    tombol.disabled = false; tombol.textContent = "Simpan kata sandi";
    toast("Gagal menyimpan kata sandi: " + error.message);
    return;

  await sb.auth.signOut();
  modeAuth = "masuk";
  toast("Kata sandi baru tersimpan. Silakan masuk kembali.");

sb.auth.onAuthStateChange((event, session) => {
  if(event === "PASSWORD_RECOVERY"){
    sesiPemulihan = true;
    tampilkanResetSandi();
    return;
  }
  if(session && session.user){
    muatProfilDanRender(session.user.id);
  } else {
    tampilkanPublikDanLogin();
  }
});

async function simpanRiwayatKalender(){

function buatGridBulan(acuan){
  const ref = acuan || bulanTampil;
  const tahun = ref.getFullYear(), bulan = ref.getMonth();
  const awal = new Date(tahun, bulan, 1);
  const akhir = new Date(tahun, bulan+1, 0);
  const offsetAwal = (awal.getDay() + 6) % 7; // Senin = 0
  const sel = [];
  for(let i=0; i<offsetAwal; i++) sel.push(null);
  for(let d=1; d<=akhir.getDate(); d++) sel.push(new Date(tahun, bulan, d));
  while(sel.length < 42) sel.push(null); // selalu 6 baris supaya tinggi kalender tidak berubah antar bulan
  return sel;
}

function renderKalenderGrid(){
  const grid = buatGridBulan();
  const peta = {};
  daftarJadwalTampil().forEach(j => { (peta[j.tanggal] = peta[j.tanggal] || []).push(j); });
  const bulanLabel = bulanTampil.toLocaleDateString("id-ID", {month:"long", year:"numeric"});
  const hariIni = toISO(new Date());

  return `
  <div class="kal-head">
    <button class="btn btn-o btn-s" data-act="bulanSebelum">&larr;</button>
    <b>${bulanLabel}</b>
    <button class="btn btn-o btn-s" data-act="bulanBerikut">&rarr;</button>
  </div>
  <div class="kal-grid">
    ${HARI_SINGKAT.map(h => `<div class="kal-dow">${h}</div>`).join("")}
    ${grid.map(d => {
      if(!d) return `<div class="kal-sel kal-kosong"></div>`;
      const iso = toISO(d);
      const ev = peta[iso] || [];
      const aktif = iso === tanggalDipilih;
      const kelas = "kal-sel" + (aktif ? " kal-aktif" : "") + (iso === hariIni ? " kal-ini" : "");
      const tampil = ev.slice(0, 3).map(e => {
        const jn = kegiatanByValue(e.jenis_kegiatan);
        const w = aktif ? {bg:"rgba(255,255,255,.28)", c:"#fff"} : {bg:LABEL_STATUS[e.status].bg, c:LABEL_STATUS[e.status].c};
        return `<span class="kal-kode" style="background:${w.bg}; color:${w.c}">${jn ? jn.k : "?"}</span>`;
      }).join("");
      const lebih = ev.length > 3
        ? `<span class="kal-kode" style="background:${aktif?"rgba(255,255,255,.28)":"var(--line2)"}; color:${aktif?"#fff":"var(--graphite)"}">+${ev.length-3}</span>`
        : "";
      return `<button class="${kelas}" data-act="pilihTanggal" data-tgl="${iso}">
        <span class="kal-angka">${d.getDate()}</span>
        <span class="kal-kodewrap">${tampil}${lebih}</span>
      </button>`;
    }).join("")}
  </div>`;
}

}

function halamanInputMR(){
  if(!mrBulan) mrBulan = new Date(bulanTampil);
  const grid = buatGridBulan(mrBulan);
  const bulanLabel = mrBulan.toLocaleDateString("id-ID", {month:"long", year:"numeric"});
  const sudahAdaMR = new Set(daftarJadwal.filter(j => j.jenis_kegiatan === "morning_report").map(j => j.tanggal));

  return `<div class="card">
    <div class="card-h"><h2>Input Jadwal Morning Report</h2></div>
    <div class="card-b">
      <p class="hint" style="margin-top:0">Pilih pembimbing, lalu centang semua tanggal jadwalnya bulan ini. Tanggal yang sudah ditandai "MR" berarti sudah pernah diinput.</p>
      <div class="field"><label>Pembimbing</label>
        <select id="mr-pembimbing">
          <option value="">Pilih pembimbing</option>
          ${DAFTAR_PEMBIMBING.map(n => `<option value="${esc(n)}" ${n===mrPembimbing?"selected":""}>${esc(n)}</option>`).join("")}
        </select></div>
      <div class="kal-head" style="margin-top:14px">
        <button class="btn btn-o btn-s" data-act="mrBulanSebelum">&larr;</button>
        <b>${bulanLabel}</b>
        <button class="btn btn-o btn-s" data-act="mrBulanBerikut">&rarr;</button>
      </div>
      <div class="kal-grid">
        ${HARI_SINGKAT.map(h => `<div class="kal-dow">${h}</div>`).join("")}
        ${grid.map(d => {
          if(!d) return `<div class="kal-sel kal-kosong"></div>`;
          const iso = toISO(d);
          const sudahAda = sudahAdaMR.has(iso);
          const dicentang = mrTanggalTercentang.has(iso);
          const kelas = "kal-sel" + (dicentang ? " kal-aktif" : "");
          if(sudahAda) return `<div class="${kelas} kal-sel" style="opacity:.5; cursor:not-allowed" title="Sudah ada Morning Report tanggal ini">
            <span class="kal-angka">${d.getDate()}</span>
            <span class="kal-kode" style="background:var(--line2); color:var(--graphite)">MR</span>
          </div>`;
          return `<button class="${kelas}" data-act="mrCentang" data-tgl="${iso}">
            <span class="kal-angka">${d.getDate()}</span>
            ${dicentang ? `<span class="kal-kode" style="background:rgba(255,255,255,.3); color:#fff">&#10003;</span>` : ""}
          </button>`;
        }).join("")}
      </div>
      <p class="hint" style="margin:12px 0"><b>${mrTanggalTercentang.size}</b> tanggal dipilih.</p>
      <button class="btn btn-p" id="btn-input-mr">Input Semua (${mrTanggalTercentang.size})</button>
    </div>
  </div>`;
}

function renderMenunggu(){
  const list = daftarJadwal.filter(j => j.status === "menunggu").sort((a,b) => a.tanggal.localeCompare(b.tanggal));
  return `<div class="card">
    <div class="card-h"><h2>Menunggu Persetujuan</h2><span class="sub">${list.length} kegiatan</span></div>
    <div class="card-b">
      ${list.length ? list.map(j => `<div class="eyebrow" style="margin:14px 0 4px">${fmtTanggalPendek(j.tanggal)}</div>${barisJadwal(j)}`).join("")
        : `<div class="empty"><b>Tidak ada yang menunggu</b>Semua kegiatan sudah ditinjau.</div>`}
    </div>
  </div>`;
}

function render(){
  const moderasi = bisaModerasi();
  const jumlahMenunggu = daftarJadwal.filter(j => j.status === "menunggu").length;

  const tabsUtama = `<div class="tabs-admin" style="margin-bottom:16px">
      <button data-act="tabUtamaKalender" aria-pressed="${tabUtama==="kalender"}">Kalender</button>
      ${FITUR_LANGGANAN_AKTIF ? `<button data-act="tabUtamaLangganan" aria-pressed="${tabUtama==="langganan"}">Sinkron ke Kalender Perangkat</button>` : ""}
      ${bisaModerasi() ? `<button data-act="tabUtamaInputMR" aria-pressed="${tabUtama==="inputMR"}">Input Morning Report</button>` : ""}
    </div>`;

  if(tabUtama === "langganan" && FITUR_LANGGANAN_AKTIF){
    document.getElementById("isi").innerHTML = `${tabsUtama}${kartuLangganan()}`;
    return;
  }
  if(tabUtama === "inputMR" && bisaModerasi()){
    document.getElementById("isi").innerHTML = `${tabsUtama}${halamanInputMR()}`;
    return;
  }
  if(tabUtama === "profil"){
    document.getElementById("isi").innerHTML = `${tabsUtama}${halamanProfil()}`;
    return;
  }

  document.getElementById("isi").innerHTML = `
    ${tabsUtama}
    <div class="kal-2kolom">
      <div>
        ${moderasi ? `<div class="tabs-admin" style="visibility:hidden" aria-hidden="true">
          <button tabindex="-1">Kalender</button>
          <button tabindex="-1">Menunggu Persetujuan</button>
        </div>` : ""}
        ${FITUR_TELEGRAM_AKTIF ? kartuTelegram() : ""}
        ${bisaUnggah() ? formAjukan() : ""}
      </div>
      <div>
        ${moderasi ? `<div class="tabs-admin">
          <button data-act="tabAdminKalender" aria-pressed="${tabAdmin!=="menunggu"}">Kalender</button>
          <button data-act="tabAdminMenunggu" aria-pressed="${tabAdmin==="menunggu"}">Menunggu Persetujuan${jumlahMenunggu?`<span class="badge">${jumlahMenunggu}</span>`:""}</button>
        </div>` : ""}
        ${moderasi && tabAdmin==="menunggu" ? renderMenunggu() : `
        <div class="card">
          <div class="card-h"><h2>Kalender kegiatan</h2>
            <span class="sub">${daftarJadwalTampil().length} kegiatan</span></div>
          <div class="card-b">
            ${tabsKalenderDalam()}
            ${tabKalenderDalam === "morningReport" ? renderDaftarMR() : `${renderKalenderGrid()}${renderDaftarTanggal()}`}
          </div>
        </div>`}
      </div>
    </div>`;
}

// Dipakai oleh tombol di dalam kalender (ganti bulan, pilih tanggal) yang bisa
// diklik baik oleh pengguna yang sudah masuk maupun pengunjung yang belum masuk.
function renderUlang(){
  if(profilSaya) render(); else tampilkanLogin();
}

async function simpanInputMR(){
  if(sedangProses) return;
  const pembimbing = document.getElementById("mr-pembimbing").value;
  if(!pembimbing){ toast("Pilih pembimbing dulu."); return; }
  if(mrTanggalTercentang.size === 0){ toast("Centang minimal satu tanggal."); return; }

  sedangProses = true;
  const tombol = document.getElementById("btn-input-mr");
  tombol.disabled = true; tombol.textContent = "Menyimpan…";

  const payload = [...mrTanggalTercentang].map(tgl => ({
    user_id: profilSaya.id, nama_pengunggah: profilSaya.nama,
    tanggal: tgl, jam: "08:00", jenis_kegiatan: "morning_report", mode_pelaksanaan: "luring",
    nama_pembimbing: pembimbing, lokasi: "RS. Adam Malik Medan / RS USU Medan", status: "disetujui"
  }));

  const { error } = await sb.from("jadwal_akademik").insert(payload);
  sedangProses = false;
  if(error){
    toast("Gagal menyimpan: " + error.message);
    tombol.disabled = false; tombol.textContent = `Input Semua (${mrTanggalTercentang.size})`;
    return;
  }
  toast(`${payload.length} jadwal Morning Report berhasil dimasukkan.`);
  mrTanggalTercentang = new Set();
  mrPembimbing = pembimbing;
  await muatJadwal();
  render();
}

async function ajukanKegiatan(){
  if(sedangProses) return;
  const tanggal = document.getElementById("j-tanggal").value;
  const jam = document.getElementById("j-jam").value;
  const jenis = document.getElementById("j-jenis").value;
  const presentanPilihan = document.getElementById("j-presentan").value;
  let presentan = profilSaya.nama;
  let presentanUserId = profilSaya.id;
  if(presentanPilihan === "__lainnya__"){
    presentan = document.getElementById("j-presentan-lain").value.trim();
    presentanUserId = null;
  }
  const mode = document.getElementById("j-mode").value;
  const lokasi = document.getElementById("j-lokasi").value.trim();
  const judul = document.getElementById("j-judul").value.trim();
  let pembimbing = document.getElementById("j-pembimbing").value;
  if(pembimbing === "__lainnya__"){
    pembimbing = document.getElementById("j-pembimbing-lain").value.trim();
  }
  const zoom = mode !== "luring" ? document.getElementById("j-zoom").value.trim() : "";
  const ket = document.getElementById("j-ket").value.trim();
  if(!tanggal){ toast("Tanggal kegiatan wajib diisi."); return; }
  if(!jenis){ toast("Pilih jenis kegiatan."); return; }
  if(!presentan){ toast("Pilih nama presentan."); return; }

  sedangProses = true;
  const tombol = document.getElementById("btn-ajukan");
  tombol.disabled = true; tombol.textContent = "Mengirim…";

  const payload = {
    user_id: profilSaya.id, nama_pengunggah: profilSaya.nama,
    tanggal, jam: jam || null, jenis_kegiatan: jenis, mode_pelaksanaan: mode, lokasi: lokasi || null,
    nama_presentan: presentan, presentan_user_id: presentanUserId, judul_kegiatan: judul || null,
    nama_pembimbing: pembimbing || null, link_zoom: zoom || null, keterangan: ket || null
  };
  if(profilSaya.peran === "admin") payload.status = "disetujui";

  const { error } = await sb.from("jadwal_akademik").insert(payload);
  sedangProses = false;
  if(error){
    toast("Gagal menyimpan: " + error.message);
    tombol.disabled = false; tombol.textContent = "Ajukan";
    return;
  }
  toast(profilSaya.peran === "admin" ? "Kegiatan ditambahkan." : "Kegiatan terkirim, menunggu persetujuan.");
  tanggalDipilih = tanggal;
  bulanTampil = new Date(tanggal + "T00:00:00"); bulanTampil.setDate(1);
  await muatJadwal();
  render();
}

async function setujuiJadwal(id){
  const { error } = await sb.from("jadwal_akademik").update({ status:"disetujui", catatan_admin:null }).eq("id", id);
  if(error){ toast("Gagal menyetujui: " + error.message); return; }
  toast("Kegiatan disetujui.");
  await muatJadwal(); render();
}

async function tolakJadwal(id){
  const alasan = prompt("Alasan penolakan (opsional):") || null;
  const { error } = await sb.from("jadwal_akademik").update({ status:"ditolak", catatan_admin: alasan }).eq("id", id);
  if(error){ toast("Gagal menolak: " + error.message); return; }
  toast("Kegiatan ditolak.");
  await muatJadwal(); render();
}

async function hapusJadwal(id){
  const j = daftarJadwal.find(x => x.id === id);
  if(!j) return;
  if(!confirm(`Hapus kegiatan "${j.judul_kegiatan}"?`)) return;
  const { error } = await sb.from("jadwal_akademik").delete().eq("id", id);
  if(error){ toast("Gagal menghapus: " + error.message); return; }
  toast("Kegiatan dihapus.");
  await muatJadwal();
  render();
}

document.addEventListener("click", ev => {
  const authtab = ev.target.closest("[data-authtab]");
  if(authtab){ modeAuth = authtab.dataset.authtab; tampilkanLogin(); return; }
  const akunBtn = ev.target.closest("[data-act]");
  if(akunBtn && akunBtn.dataset.act === "toggleAkunMenu"){
    akunMenuTerbuka = !akunMenuTerbuka;
    document.getElementById("akunMenu").hidden = !akunMenuTerbuka;
    return;
  }
  if(akunBtn && akunBtn.dataset.act === "bukaProfilSaya"){
    akunMenuTerbuka = false;
    document.getElementById("akunMenu").hidden = true;
    tabUtama = "profil"; render();
    return;
  }
  if(akunBtn && akunBtn.dataset.act === "keluar"){ sb.auth.signOut(); return; }
  if(akunMenuTerbuka && !ev.target.closest(".akun-dropdown")){
    akunMenuTerbuka = false;
    document.getElementById("akunMenu").hidden = true;
  }
  if(ev.target && (ev.target.id === "modalVersi" || ev.target.closest('[data-act="tutupModalVersi"]'))){
    document.getElementById("modalVersi").hidden = true;
    return;
  }
  if(ev.target && ev.target.id === "btn-ajukan"){ ajukanKegiatan(); return; }
  if(ev.target && ev.target.id === "btn-putus-telegram"){ putuskanTelegram(); return; }
  if(ev.target && ev.target.id === "btn-salin-langganan"){ salinAlamatLangganan(); return; }
  if(ev.target && ev.target.id === "btn-simpan-profil"){ simpanProfilKalender(); return; }
  if(ev.target && ev.target.id === "btn-ubah-sandi"){ ubahSandiKalender(); return; }
  if(ev.target && ev.target.id === "btn-tambah-riwayat"){ draftRiwayat.push({jenjang:"",institusi:"",tahun:""}); render(); return; }
  if(ev.target && ev.target.id === "btn-simpan-riwayat"){ simpanRiwayatKalender(); return; }
  if(ev.target && ev.target.id === "btn-input-mr"){ simpanInputMR(); return; }
  const b = ev.target.closest("[data-act]");
  if(!b) return;
  if(b.dataset.act === "tabAdminKalender"){ tabAdmin = "kalender"; render(); return; }
  if(b.dataset.act === "tabAdminMenunggu"){ tabAdmin = "menunggu"; render(); return; }
  if(b.dataset.act === "tabUtamaKalender"){ tabUtama = "kalender"; render(); return; }
  if(b.dataset.act === "tabUtamaLangganan"){ tabUtama = "langganan"; render(); return; }
  if(b.dataset.act === "tabUtamaProfil"){ tabUtama = "profil"; render(); return; }
  if(b.dataset.act === "hapusRiwayatKal"){ draftRiwayat.splice(+b.dataset.i, 1); render(); return; }
  if(b.dataset.act === "bulanSebelum"){ bulanTampil.setMonth(bulanTampil.getMonth()-1); renderUlang(); return; }
  if(b.dataset.act === "bulanBerikut"){ bulanTampil.setMonth(bulanTampil.getMonth()+1); renderUlang(); return; }
  if(b.dataset.act === "pilihTanggal"){ tanggalDipilih = b.dataset.tgl; renderUlang(); return; }
  if(b.dataset.act === "tabKalDalamKalender"){ tabKalenderDalam = "kalender"; renderUlang(); return; }
  if(b.dataset.act === "tabKalDalamMR"){ tabKalenderDalam = "morningReport"; renderUlang(); return; }
  if(b.dataset.act === "tabUtamaInputMR"){ tabUtama = "inputMR"; render(); return; }
  if(b.dataset.act === "mrBulanSebelum"){ mrBulan.setMonth(mrBulan.getMonth()-1); render(); return; }
  if(b.dataset.act === "mrBulanBerikut"){ mrBulan.setMonth(mrBulan.getMonth()+1); render(); return; }
  if(b.dataset.act === "mrCentang"){
    const tgl = b.dataset.tgl;
    if(mrTanggalTercentang.has(tgl)) mrTanggalTercentang.delete(tgl); else mrTanggalTercentang.add(tgl);
    render(); return;
  }
  if(ev.target && ev.target.id === "btn-input-mr"){ simpanInputMR(); return; }
  const id = b.dataset.id;
  if(b.dataset.act === "setujui") setujuiJadwal(id);
  if(b.dataset.act === "tolak") tolakJadwal(id);
  if(b.dataset.act === "hapus") hapusJadwal(id);
  if(b.dataset.act === "ubahJadwal"){ sedangEdit = id; render(); }
  if(b.dataset.act === "batalUbah"){ sedangEdit = null; render(); }
  if(b.dataset.act === "simpanUbah") simpanUbahJadwal(id);
});

</script>
</body>
</html>
