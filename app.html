<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logbook Radiologi Fakultas Kedokteran Universitas Sumatera Utara</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0OCIgZmlsbD0iIzExMTExMSIvPgogIDxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjQ0IiBmaWxsPSIjRkZDQzAwIi8+CiAgPHBhdGggZD0iTTUwLDUwIEwyOSwxMy42IEE0Miw0MiAwIDAsMSA3MSwxMy42IFoiIGZpbGw9IiMxMTExMTEiLz4KICA8cGF0aCBkPSJNNTAsNTAgTDkyLDUwIEE0Miw0MiAwIDAsMSA3MSw4Ni40IFoiIGZpbGw9IiMxMTExMTEiLz4KICA8cGF0aCBkPSJNNTAsNTAgTDI5LDg2LjQgQTQyLDQyIDAgMCwxIDgsNTAgWiIgZmlsbD0iIzExMTExMSIvPgogIDxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjkiIGZpbGw9IiMxMTExMTEiLz4KPC9zdmc+Cg==">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101418; --ink2:#1B2229; --graphite:#4B565F; --mist:#8A959D;
  --line:#D9DEE1; --line2:#EDF0F1; --paper:#F1F3F2; --card:#FFFFFF;
  --usu:#0A6E3C; --usu-deep:#04512A; --usu-soft:#E6F1EA;
  --amber:#96600A; --amber-soft:#FBF0DC;
  --rust:#9C3826; --rust-soft:#FAE9E5;
  --r:12px;
  --f-disp:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:600; margin:0; letter-spacing:-.01em}
a{color:var(--usu)}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
:focus-visible{outline:2px solid var(--usu); outline-offset:2px}

/* ---------- shell ---------- */
.topbar{
  background:var(--ink); color:#fff; position:sticky; top:0; z-index:40;
  border-bottom:1px solid #000;
}
.topbar-in{max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto}
.brand span{min-width:0}
.jam-beranda{font-family:var(--f-mono); font-weight:600; font-size:32px; color:var(--usu-deep); white-space:nowrap; letter-spacing:-.01em; line-height:1; text-align:right}
.tanggal-beranda{font-family:var(--f-mono); font-size:12px; color:var(--usu-deep); opacity:.7; white-space:nowrap; text-align:right; margin-top:3px}
@media (max-width:480px){.jam-beranda, .tanggal-beranda{display:none}}
.wedge-mark{display:flex; height:22px; border:1px solid #3A444C}
.wedge-mark i{width:5px; display:block}
.brand b{font-family:var(--f-disp); font-weight:700; font-size:16px; letter-spacing:.01em; display:block; line-height:1.1}
.brand small{font-family:var(--f-mono); font-size:9.5px; color:#8A959D; letter-spacing:.14em; text-transform:uppercase; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who{display:flex; align-items:center; gap:10px; flex:0 0 auto}
.who label{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:#8A959D}
.who select{
  background:#1B2229; color:#fff; border:1px solid #38424A; border-radius:var(--r);
  padding:6px 8px; font-size:13px; max-width:60vw;
}
.akun-dropdown{position:relative}
.akun-tombol{
  background:none; border:1px solid #38424A; color:#fff; border-radius:var(--r);
  padding:6px 11px; cursor:pointer; font-family:var(--f-mono); font-size:13px;
  display:flex; align-items:center; gap:7px;
}
.akun-tombol:hover{background:#1B2229}
.akun-tombol i{font-style:normal; color:#8A959D; font-size:10px}
.akun-menu{
  position:absolute; right:0; top:calc(100% + 6px); min-width:170px;
  background:#1B2229; border:1px solid #38424A; border-radius:var(--r);
  box-shadow:0 8px 24px rgba(0,0,0,.35); overflow:hidden; z-index:60;
}
.akun-menu[hidden]{display:none}
.akun-menu button{
  display:block; width:100%; text-align:left; background:none; border:0; color:#fff;
  padding:10px 13px; font-size:13px; cursor:pointer; font-family:var(--f-body);
}
.akun-menu button:hover{background:#252d35}

.nav{
  background:var(--ink); border-right:1px solid #000;
  position:fixed; left:0; top:47px; bottom:0; width:236px; overflow-y:auto; z-index:39;
}
.nav-in{padding:14px 10px; display:flex; flex-direction:column; gap:1px}
.nav-in::-webkit-scrollbar{display:none}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box; text-align:left;
  background:none; border:0; color:#9AA5AD;
  padding:8px 10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-family:var(--f-body); font-size:14px; font-weight:500; border-radius:6px;
}
.nav button span:first-of-type{overflow:hidden; text-overflow:ellipsis}
.nav-ikon{width:17px; height:17px; flex:0 0 17px; opacity:.85}
.nav button:hover{color:#fff; background:#1B2229}
.nav button[aria-current="true"]{color:#fff; background:#1B2229; font-weight:600}
.nav button[aria-current="true"] .nav-ikon{opacity:1; color:var(--usu)}
.nav .badge{
  font-family:var(--f-mono); font-size:10px; background:var(--amber); color:#fff;
  border-radius:99px; padding:1px 6px; margin-left:auto; vertical-align:1px;
}
main{max-width:1180px; margin:0 auto; padding:22px 16px 90px; transition:margin-left .15s}
body.punya-sidebar main{margin-left:236px}
@media (max-width:860px){
  .nav{background:var(--ink2); position:sticky; left:auto; top:47px; bottom:auto; width:auto; height:auto; border-right:0; border-bottom:1px solid var(--line)}
  .nav-in{flex-direction:row; overflow-x:auto; padding:0 8px; gap:2px; scrollbar-width:none}
  .nav button{width:auto; flex:none; border-bottom:2px solid transparent; border-radius:0; padding:11px 13px}
  .nav button[aria-current="true"]{border-bottom-color:var(--usu); background:none}
  body.punya-sidebar main{margin-left:0}
}

/* ---------- logo & login ---------- */
.logo{width:32px; height:32px; display:block; flex:0 0 32px}
.btn-keluar-akun{background:none; border:1px solid #38424A; color:#9AA5AD; border-radius:var(--r);
  padding:6px 11px; cursor:pointer; font-size:13px}
.btn-keluar-akun:hover{background:#1B2229; color:#fff}
.login-luar{position:fixed; inset:0; overflow-y:auto; display:flex; justify-content:center; align-items:flex-start; padding:40px 16px;
  padding:26px 16px; background:linear-gradient(rgba(9,12,15,.72),rgba(9,12,15,.72)), url("fk_wallpaper.webp") center/cover no-repeat}
.login{width:100%; max-width:400px; background:rgba(255,255,255,.8); border:1px solid rgba(255,255,255,.55);
  border-radius:var(--r); padding:30px 26px; text-align:center; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 12px 40px rgba(0,0,0,.35)}
.login-logo{width:76px; height:76px; margin:0 auto 14px; display:block}
.login h1{font-size:23px; margin-bottom:5px}
.login-sub{font-size:13px; color:var(--graphite); margin:0 0 24px; line-height:1.5}
.tabs-login{display:flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-bottom:20px}
.tabs-login button{flex:1; background:#fff; border:0; padding:9px; cursor:pointer; font-size:14px;
  font-family:var(--f-disp); font-weight:600; color:var(--graphite)}
.tabs-login button[aria-pressed="true"]{background:var(--ink); color:#fff}
.pemisah{display:flex; align-items:center; gap:11px; margin:17px 0; color:var(--mist); font-size:12px}
.pemisah::before,.pemisah::after{content:""; flex:1; height:1px; background:var(--line)}
.btn-google{width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:11px;
  cursor:pointer; font-size:14.5px; font-weight:500}
.btn-google:hover{background:var(--line2)}
.gpick{border:1px solid var(--line); border-radius:var(--r); text-align:left; overflow:hidden}
.gpick-h{padding:11px 15px; border-bottom:1px solid var(--line2); font-size:13.5px; color:var(--graphite)}
.gpick-akun{width:100%; display:flex; align-items:center; gap:12px; padding:11px 15px; background:#fff;
  border:0; border-bottom:1px solid var(--line2); cursor:pointer; text-align:left; font-size:14px}
.gpick-akun:hover{background:var(--line2)}
.gpick-akun:last-child{border-bottom:0}
.gpick-akun b{display:block; font-weight:500}
.gpick-akun small{color:var(--graphite); font-size:12.5px}
.gpick-akun.batal{color:var(--graphite); justify-content:center; font-size:13.5px}
.ava{width:32px; height:32px; border-radius:50%; color:#fff; display:flex; align-items:center;
  justify-content:center; font-weight:600; flex:0 0 32px}
.login-nota{margin-top:22px; padding-top:16px; border-top:1px solid var(--line2);
  font-size:12.5px; color:var(--graphite); text-align:left; line-height:1.55}
/* ---------- primitives ---------- */
.eyebrow{font-family:var(--f-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--mist)}
.card{background:var(--card); border:1px solid var(--line2); border-radius:var(--r); box-shadow:0 1px 2px rgba(16,20,24,.05), 0 6px 16px rgba(16,20,24,.04); overflow:hidden}
.card-h{padding:13px 16px; border-bottom:1px solid var(--line2); background:var(--paper); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.card-h h2{font-size:17px}
.card-h .sub{font-size:12.5px; color:var(--graphite); margin-left:auto}
.card-b{padding:16px}
.grid{display:grid; gap:14px}
@media(min-width:820px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g-side{grid-template-columns:1.55fr 1fr} }

.btn{
  background:var(--ink); color:#fff; border:1px solid var(--ink); border-radius:var(--r);
  padding:8px 14px; cursor:pointer; font-weight:500; font-size:14px;
}
.btn:hover{background:#000}
.btn-p{background:var(--usu); border-color:var(--usu)}
.btn-p:hover{background:var(--usu-deep); border-color:var(--usu-deep)}
.btn-o{background:transparent; color:var(--ink); border-color:var(--line)}
.btn-o:hover{background:var(--line2)}
.btn-d{background:transparent; color:var(--rust); border-color:#E2C6C0}
.btn-d:hover{background:var(--rust-soft)}
.btn-s{padding:5px 10px; font-size:13px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.field{margin-bottom:13px}
.field label{display:block; font-family:var(--f-mono); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--graphite); margin-bottom:5px}
.field .hint{font-family:var(--f-body); font-size:12px; color:var(--mist); letter-spacing:0; text-transform:none; margin-top:4px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:var(--r);
  background:#fff; font-size:14.5px;
}
textarea{min-height:74px; resize:vertical}
.req{color:var(--rust)}

.pill{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:10.5px;
  letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:99px; border:1px solid;
}
.p-ver{background:var(--usu-soft); color:var(--usu-deep); border-color:#BEDDCB}
.p-tunggu{background:var(--amber-soft); color:var(--amber); border-color:#E9D3A8}
.p-rev{background:var(--rust-soft); color:var(--rust); border-color:#E9C8C0}
.p-draft{background:var(--line2); color:var(--graphite); border-color:var(--line)}

.mono{font-family:var(--f-mono)}
.muted{color:var(--graphite)}
.empty{padding:34px 18px; text-align:center; color:var(--graphite)}
.empty b{display:block; font-family:var(--f-disp); font-size:16px; color:var(--ink); margin-bottom:5px}

table{width:100%; border-collapse:collapse; font-size:14px}
th{
  text-align:left; font-family:var(--f-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--graphite); font-weight:500; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:11px 12px; border-bottom:1px solid var(--line2); vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}

/* ---------- step wedge (signature) ---------- */
.wedge-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line2)}
.wedge-row:last-child{border-bottom:0}
.wedge-name{flex:0 0 118px; font-size:13.5px; font-weight:500}
.wedge{display:flex; flex:1; height:19px; border:1px solid var(--line); background:#fff; min-width:90px}
.wedge span{flex:1; border-right:1px solid rgba(255,255,255,.55)}
.wedge span:last-child{border-right:0}
.wedge-num{flex:0 0 auto; font-family:var(--f-mono); font-size:12px; color:var(--graphite); white-space:nowrap}
.wedge-num b{color:var(--ink); font-weight:600}
.wedge.done{border-color:var(--usu)}

.stat{display:flex; flex-direction:column; gap:2px; padding:12px 14px; border:1px solid var(--line2); border-radius:var(--r); background:#fff; box-shadow:0 1px 2px rgba(16,20,24,.05), 0 6px 16px rgba(16,20,24,.04)}
.stat-usu{background:var(--usu-soft); border-color:var(--usu-soft)}
.stat-amber{background:var(--amber-soft); border-color:var(--amber-soft)}
.stat-rust{background:var(--rust-soft); border-color:var(--rust-soft)}
.stat b{font-family:var(--f-mono); font-size:24px; font-weight:600; line-height:1.1}
.stat span{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--graphite)}

/* ---------- entries ---------- */
.entry{border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:13px 15px; margin-bottom:10px}
.entry-top{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:6px}
.entry-top time{font-family:var(--f-mono); font-size:12px; color:var(--graphite)}
.entry h4{font-size:15.5px}
.entry .meta{font-size:13px; color:var(--graphite); margin-top:3px}
.entry .acts{display:flex; gap:7px; margin-top:11px; flex-wrap:wrap}
.note{background:var(--rust-soft); border-left:2px solid var(--rust); padding:8px 11px; margin-top:9px; font-size:13.5px; border-radius:0 var(--r) var(--r) 0}

.gpsbox{border:1px dashed var(--line); border-radius:var(--r); padding:12px; background:#FAFBFB}
.gpsbox.ok{border-style:solid; border-color:#BEDDCB; background:var(--usu-soft)}
.gpsbox.err{border-style:solid; border-color:#E9C8C0; background:var(--rust-soft)}
.coord{font-family:var(--f-mono); font-size:13px}

/* ---------- panel detail untuk konsulen ---------- */
.detail{border-top:1px solid var(--line); margin-top:12px; padding-top:13px}
.dl{display:grid; gap:0; margin:0}
.dl>div{display:grid; grid-template-columns:150px 1fr; gap:12px; padding:7px 0; border-bottom:1px solid var(--line2)}
.dl>div:last-child{border-bottom:0}
.dl dt{font-family:var(--f-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--graphite); padding-top:2px}
.dl dd{margin:0; font-size:14.5px}
.dl dd.long{white-space:pre-wrap}
@media(max-width:640px){ .dl>div{grid-template-columns:1fr; gap:2px} }
.readgate{
  display:flex; align-items:center; gap:8px; font-size:13px; color:var(--amber);
  background:var(--amber-soft); border:1px solid #E9D3A8; border-radius:var(--r); padding:8px 11px; margin-top:11px;
}
.readgate.ok{color:var(--usu-deep); background:var(--usu-soft); border-color:#BEDDCB}
.revbox{border:1px solid var(--line); border-radius:var(--r); padding:12px; margin-top:11px; background:#FAFBFB}
.gps-detail{font-family:var(--f-mono); font-size:13px}
/* ---------- unggah bukti ---------- */
.drop{border:1px dashed var(--line); border-radius:var(--r); padding:14px; background:#FAFBFB; text-align:center}
.drop b{font-family:var(--f-disp); display:block; font-size:14.5px}
.drop p{margin:4px 0 10px; font-size:13px; color:var(--graphite)}
.thumbs{display:flex; flex-wrap:wrap; gap:9px; margin-top:11px}
.thumb{
  position:relative; width:92px; border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; background:#fff;
}
.thumb img{display:block; width:100%; height:70px; object-fit:cover; cursor:pointer}
.thumb .pdf{
  display:flex; align-items:center; justify-content:center; height:70px; cursor:pointer;
  background:var(--ink2); color:#fff; font-family:var(--f-mono); font-size:11px; letter-spacing:.1em;
}
.thumb .cap{font-size:10.5px; padding:4px 5px; color:var(--graphite); border-top:1px solid var(--line2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.thumb .x{
  position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; border:0;
  background:rgba(16,20,24,.82); color:#fff; cursor:pointer; font-size:13px; line-height:1; padding:0;
}
.lb{position:fixed; inset:0; background:rgba(16,20,24,.92); z-index:200; display:flex;
  flex-direction:column; align-items:center; justify-content:center; padding:22px; gap:12px}
.lb img{max-width:94vw; max-height:76vh; object-fit:contain; background:#fff}
.lb iframe{width:94vw; height:76vh; border:0; background:#fff}
.lb .bar{display:flex; gap:9px; align-items:center; flex-wrap:wrap; justify-content:center}
.lb .name{color:#fff; font-family:var(--f-mono); font-size:12px}
.meter{height:5px; background:var(--line2); border-radius:99px; overflow:hidden; margin:7px 0 4px}
.meter i{display:block; height:100%; background:var(--usu)}
/* ---------- lembar penilaian ---------- */
.rubrik{border:1px solid var(--line); border-left:3px solid var(--usu); border-radius:0 var(--r) var(--r) 0;
  padding:14px; margin-top:13px; background:#FBFCFB}
.rubrik-h h4{font-size:15.5px; margin-top:2px}
.rubrik-h p{margin:4px 0 10px; font-size:13px}
.rubrik table{background:#fff; border:1px solid var(--line)}
.rubrik td{font-size:13.5px}
.rubrik input.skor{padding:6px 8px; text-align:center; font-family:var(--f-mono)}
.hasil{border-top:1px solid var(--line); margin-top:11px; padding-top:11px; font-size:13.5px}
.hasil-in{display:flex; align-items:center; gap:22px; flex-wrap:wrap}
.hasil-in b{display:block; font-size:26px; line-height:1.1; font-weight:600}
.nilai-kartu{border:1px solid var(--line); border-radius:var(--r); padding:12px; margin-top:10px; background:#fff}
.nilai-kartu table{border:0}
.nilai-kartu td{padding:6px 8px; font-size:13px}
.umpan{background:var(--usu-soft); border-left:2px solid var(--usu); padding:8px 11px; margin-top:10px;
  font-size:13.5px; border-radius:0 var(--r) var(--r) 0}
.terkunci{background:var(--line2); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; margin-bottom:4px}
.terkunci dd{font-weight:500}
.final-box{background:#fff; border:1px solid var(--line); border-left:3px solid var(--usu);
  border-radius:0 var(--r) var(--r) 0; padding:15px}
.final-box.sah{background:var(--usu-soft); border-color:#BEDDCB; border-left-color:var(--usu)}
.final-box h4{font-size:15.5px; margin-top:3px}
.tautan{background:none; border:0; padding:0; color:var(--usu); font-weight:600; cursor:pointer;
  font-size:14px; text-align:left; text-decoration:underline; text-underline-offset:2px}
.tautan:hover{color:var(--usu-deep)}
.cek{display:flex; align-items:center; gap:8px; font-size:13.5px; width:100%; cursor:pointer}
.cek input{width:auto; margin:0}
/* ---------- absensi ---------- */
.absen-aktif{background:var(--ink); color:#fff; border-radius:var(--r); padding:20px; text-align:center}
.absen-aktif .eyebrow{color:#8A959D}
.absen-aktif.kosong{background:#fff; color:var(--ink); border:1px solid var(--line)}
.absen-aktif.kosong .eyebrow{color:var(--mist)}
.absen-aktif.kosong .jam-besar{color:var(--line)}
.jam-besar{font-size:46px; font-weight:600; letter-spacing:-.02em; line-height:1.1; margin:6px 0}
.absen-info{display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin-top:12px}
.absen-info b{display:block; font-size:15px}
.btn-keluar{background:var(--rust); border-color:var(--rust); width:100%; padding:12px}
.btn-keluar:hover{background:#872F20; border-color:#872F20}
.absen-aktif .field label{color:#8A959D}
.absen-baris{display:flex; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line2)}
.absen-baris:last-child{border-bottom:0}
.absen-tgl{flex:0 0 92px; font-size:12.5px; color:var(--graphite); padding-top:2px}
@media(max-width:520px){ .jam-besar{font-size:38px} .absen-tgl{flex-basis:74px} }
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(140%);
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:var(--r); z-index:100;
  transition:transform .25s ease, opacity .25s ease; font-size:14px; max-width:90vw; box-shadow:0 6px 24px rgba(0,0,0,.22);
  opacity:0; pointer-events:none;
}
.toast.on{transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto}
.modal-bg{
  position:fixed; inset:0; background:rgba(9,12,15,.6); z-index:120;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-bg[hidden]{display:none}
.modal-box{
  background:#fff; border-radius:var(--r); max-width:480px; width:100%; max-height:80vh;
  overflow-y:auto; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.35); position:relative;
}
.modal-x{position:sticky; top:-24px; text-align:right; margin:-24px -24px 0; padding:10px 14px 0}
.modal-x button{background:none; border:0; font-size:22px; line-height:1; cursor:pointer; color:var(--mist)}
.modal-x button:hover{color:var(--ink)}
.versi-blok{margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line2)}
.versi-blok:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
.versi-blok .eyebrow{margin-bottom:4px}
.versi-blok ul{margin:6px 0 0; padding-left:18px}
.versi-blok li{margin-bottom:3px; font-size:13.5px; line-height:1.5}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{background:#fff; border:1px solid var(--line); border-radius:99px; padding:5px 13px; cursor:pointer; font-size:13.5px}
.tabs button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.banner{background:#fff; border:1px solid var(--line); border-left:3px solid var(--usu); padding:12px 15px; border-radius:0 var(--r) var(--r) 0; margin-bottom:18px; font-size:13.5px}
.app-footer{
  position:fixed; left:0; right:0; bottom:0; z-index:65;
  background:rgba(16,20,24,.85); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  padding:7px 16px; text-align:center;
  font-family:var(--f-mono); font-size:10.5px; color:#C7CDD1; letter-spacing:.04em;
}
.rail-tabs{
  position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:70;
  display:flex; flex-direction:column;
}
.rail-tabs a{
  color:#fff; text-decoration:none;
  font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  padding:16px 8px; border:1px solid #000; border-right:0; border-bottom:0;
  writing-mode:vertical-rl; text-orientation:mixed;
  box-shadow:-4px 0 14px rgba(0,0,0,.2);
}
.rail-tabs a:last-child{border-bottom:1px solid #000}
.rail-tabs a:first-child{border-radius:var(--r) 0 0 0}
.rail-tabs a:last-child{border-radius:0 0 0 var(--r)}
.rail-beranda{background:var(--ink)}
.rail-beranda:hover{background:#1B2229}
.rail-kalender{background:var(--usu)}
.rail-kalender:hover{background:#0c8449}
.rail-panel{background:var(--amber)}
.rail-panel:hover{background:#7a4d08}
@media (max-width:640px){.rail-tabs a{padding:12px 6px; font-size:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media print{.topbar,.nav,.acts,.btn{display:none!important} body{background:#fff}}

function angkaSemester(ket){
  const m = String(ket||"").match(/(\d+)/);
  return m ? +m[1] : 999;
}
function urutkanPeserta(list){
  const dir = urutPeserta.arah === "desc" ? -1 : 1;
  return list.slice().sort((a,b) => urutPeserta.kolom === "semester"
    ? (angkaSemester(a.ket) - angkaSemester(b.ket)) * dir
    : a.nama.localeCompare(b.nama, "id") * dir);
}
function thUrut(label, kolom){
  const aktif = urutPeserta.kolom === kolom;
  const panah = aktif ? (urutPeserta.arah === "asc" ? " &#9650;" : " &#9660;") : "";
  return `<th><button class="tautan" data-act="urutkanPeserta" data-kolom="${kolom}" style="font:inherit; font-weight:inherit">${esc(label)}${panah}</button></th>`;
}

// Ambil profil milik akun yang sedang masuk dari Supabase, lalu jadikan
// satu-satunya isi DB.users untuk sesi ini.
async function muatProfilAktif(userId){
  const { data, error } = await sb.from("profil").select("*").eq("id", userId).maybeSingle();
  if(error || !data){
    toast("Gagal memuat profil akun. Coba masuk kembali.");
    await sb.auth.signOut();
    DB.sesiLogin = false;
    return;
  }
  const p = profilKeApp(data);
  DB.users = [p];
  DB.aktif = p.id;
  DB.sesiLogin = true;

  // Muat data pendukung satu per satu. Dibungkus try/catch per langkah supaya
  // satu permintaan yang gagal (mis. koneksi terputus sesaat) tidak membuat
  // seluruh proses masuk berhenti dan pengguna tertahan di halaman login.
  const amanMuat = async (fn) => { try { await fn(); } catch(e) { console.error(e); } };

  // Staf/admin butuh melihat semua akun (menu Akun, rekap peserta, dsb).
  // Peserta biasa hanya butuh melihat daftar staf, untuk dropdown supervisor/pembimbing.
  if(p.peran === "admin" || p.peran === "supervisor") await amanMuat(muatSemuaAkun);
  else await amanMuat(muatDaftarStaf);

  if(p.peran === "ppds") await amanMuat(muatPengajuanSemesterSaya);
  if(p.peran === "admin") await amanMuat(muatPengajuanSemesterMenunggu);
  if(p.peran === "ppds" || p.peran === "p3d") await amanMuat(muatEntriSaya);
  if(p.peran === "supervisor") await amanMuat(muatEntriUntukVerifikasi);
  if(p.peran === "admin") await amanMuat(muatSemuaEntri);

  await amanMuat(muatLokasi);
  if(p.peran === "ppds" || p.peran === "p3d") await amanMuat(muatAbsensiSaya);
  if(p.peran === "supervisor" || p.peran === "admin") await amanMuat(muatAbsensiSemua);

  DB.cuti = [];
  if(p.peran === "ppds" || p.peran === "p3d") await amanMuat(muatCutiSaya);
  if(p.peran === "admin") await amanMuat(muatCutiSemua);

  DB.tesis = [];
  if(p.peran === "ppds") await amanMuat(muatTesisSaya);
  if(p.peran === "admin"){ await amanMuat(muatTesisSemua); await amanMuat(muatEntriTesisSemua); }

  DB.kontenBeranda = [];
  if(p.peran === "admin") await amanMuat(muatKontenBeranda);

  DB.logAktivitas = [];
  if(p.peran === "admin" && p.superAdmin) await amanMuat(muatLogAktivitas);
}

// Ubah satu baris tabel entri (kolom umum + rincian jsonb) ke bentuk datar
// yang sudah dipakai kode lama (mis. e.modalitas, e.supervisor).
function entriKeApp(e){
  return Object.assign({
    id: e.id, userId: e.user_id,
    kategori: e.kategori === "tesis_final" ? "tesisFinal"
      : e.kategori === "ujian_tingkat" ? "ujianTingkat" : e.kategori,
    tanggal: e.tanggal, status: e.status,
    supervisor: e.supervisor_id, verifikator: e.verifikator_id, waktuVerifikasi: e.waktu_verifikasi,
    catatan: e.catatan || "", catatanVerifikator: e.catatan_verifikator || "",
    bukti: e.lampiran || [], kalenderId: e.kalender_id || null, asliSupabase: true
  }, e.rincian || {});
}

// Gabungkan hasil query entri (bisa dipanggil lebih dari sekali per sesi,
// mis. entri milik sendiri + entri yang menunggu diverifikasi) tanpa saling menghapus.
function gabungEntri(rows){
  const peta = new Map(DB.entries.filter(x => x.asliSupabase).map(e => [e.id, e]));
  rows.forEach(r => peta.set(r.id, entriKeApp(r)));
  DB.entries = DB.entries.filter(x => !x.asliSupabase).concat([...peta.values()]);
}

  rows.forEach(r => peta.set(r.id, profilKeApp(r)));
  DB.users = [...peta.values()];
}

function warnaAva(n){
  const w = ["#0A6E3C","#1F4E79","#8A4B08","#5B2C6F","#0E6655","#7B241C"];
  let h = 0; for(const c of n) h = (h*31 + c.charCodeAt(0)) % 997;
  return w[h % w.length];
}

/* ============ 4b. SEMESTER & CUTI ============ */
const bedaHari = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const cutiUser = id => (DB.cuti||[]).filter(c => c.userId === id);
const jenisCuti = n => JENIS_CUTI.find(j => j.n === n) || {perpanjang:false};

// Total hari cuti yang memperpanjang masa pendidikan, dihitung sampai tanggal tertentu.
function hariCutiSampai(userId, sampai){
  const batas = new Date(sampai);
  return cutiUser(userId)
    .filter(c => c.status === "disetujui" && c.perpanjang)
    .reduce((t,c) => {
      const m = new Date(c.mulai), sl = new Date(c.selesai);
      if(m > batas) return t;
      const akhir = sl > batas ? batas : sl;
      return t + Math.max(0, Math.round((akhir - m)/86400000) + 1);
    }, 0);
}

// Semester hasil hitungan otomatis pada suatu tanggal.
function semesterOtomatis(u, tgl){
  if(!u.mulaiPendidikan) return null;
  const efektif = bedaHari(u.mulaiPendidikan, tgl) - hariCutiSampai(u.id, tgl);
  if(efektif < 0) return null;
  return Math.max(1, Math.floor(efektif / HARI_SEMESTER) + 1);
}

const semesterPada = (u, tgl) => semesterOtomatis(u, tgl);
const semesterKini = u => semesterPada(u, hariIni());

// Tanggal mulai pendidikan yang setara untuk seseorang yang, per hari ini,
// ada di semester tertentu -- dipakai saat Admin menetapkan/mengoreksi
// semester (bukan lagi lewat semester_manual, supaya hitungan tetap
// otomatis naik terus ke depan, tidak membeku di angka itu).
function mulaiPendidikanUntukSemester(semester, tgl){
  return tglMinus(tgl, Math.round((semester - 0.5) * HARI_SEMESTER));
}

function labelSemester(u){
  const sm = semesterKini(u);
  if(u.peran === "p3d") return u.ket;
  if(sm == null) return "Tanggal mulai pendidikan belum diisi";
  return `Semester ${sm}`;
}

// Cuti yang sedang berlangsung hari ini.
function cutiAktif(userId){
  const t = hariIni();
  return cutiUser(userId).find(c => c.status === "disetujui" && c.mulai <= t && c.selesai >= t);
}
const cutiMenunggu = () => (DB.cuti||[]).filter(c => c.status === "menunggu");

// Kelompokkan entri milik seorang peserta menurut semester.
function rekapSemester(u){
  const hasil = {};
  const catat = (sm, f) => { if(sm==null) return;
    hasil[sm] = hasil[sm] || {kasus:0,tindakan:0,ilmiah:0,jaga:0,hadir:0,nilai:[],mulai:null,akhir:null};
    f(hasil[sm]); };
  DB.entries.filter(e => e.userId === u.id).forEach(e => {
    const sm = semesterPada(u, e.tanggal);
    catat(sm, r => {
      if(e.kategori === "absensi"){ if(e.keluar) r.hadir++; }
      else if(e.status === "terverifikasi" && r[e.kategori] !== undefined) r[e.kategori]++;
      if(e.penilaian) r.nilai.push(e.penilaian.total);
      if(!r.mulai || e.tanggal < r.mulai) r.mulai = e.tanggal;
      if(!r.akhir || e.tanggal > r.akhir) r.akhir = e.tanggal;
    });
  });
  cutiUser(u.id).filter(c=>c.status==="disetujui").forEach(c => {
    const sm = semesterPada(u, c.mulai);
    catat(sm, r => { r.cuti = (r.cuti||0) + (bedaHari(c.mulai,c.selesai)+1); });
  });
  return hasil;
}

/* ============ 6. STEP WEDGE (indikator capaian) ============ */
function wedge(label, n, target){
  const pct = target ? Math.min(1, n/target) : 0;
  const langkah = 10, isi = Math.round(pct*langkah), done = n >= target;
  let cells = "";
  for(let i=0;i<langkah;i++){
    if(i < isi){
      const g = done ? "var(--usu)" : `hsl(203 16% ${58 - i*4}%)`;
      cells += `<span style="background:${g}"></span>`;
    } else cells += `<span style="background:#EEF1F2"></span>`;
  }
  return `<div class="wedge-row">
    <span class="wedge-name">${esc(label)}</span>
    <span class="wedge ${done?"done":""}" role="img" aria-label="${esc(label)}: ${n} dari ${target}">${cells}</span>
    <span class="wedge-num"><b>${n}</b>/${target}</span>
  </div>`;
}

  if(j < 11) return "Selamat pagi";
  if(j < 15) return "Selamat siang";
  if(j < 19) return "Selamat sore";
  return "Selamat malam";
}
function teksJamSaja(){
  return new Date().toLocaleTimeString("id-ID",{hour:"2-digit", minute:"2-digit", second:"2-digit"});
}
function teksTanggalSaja(){
  return new Date().toLocaleDateString("id-ID",{weekday:"long", day:"2-digit", month:"long", year:"numeric"});
}

  if(bel) bel.textContent = teksJamSaja();

const GELAR_DEPAN = new Set(["dr.","dr","drg.","drg","prof.","prof"]);
function namaDepan(nama){
  const kata = String(nama || "").trim().split(/\s+/).filter(Boolean);
  let i = 0;
  while(i < kata.length - 1 && GELAR_DEPAN.has(kata[i].toLowerCase())) i++;
  return kata[i] || nama || "";
}

/* ============ 8. JUDUL & RINGKASAN ENTRI ============ */
function judulEntri(e){
  if(e.kategori==="kasus") return `${e.modalitas} — ${e.regio}`;
  if(e.kategori==="tindakan") return e.jenisTindakan;
  if(e.kategori==="ilmiah") return `${e.jenis}: ${e.judul||"(tanpa judul)"}`;
  if(e.kategori==="jaga") return `${e.jenis} — ${e.lokasi}`;
  if(e.kategori==="absensi") return `Absensi ${e.kegiatan} — ${e.lokasi}`;
  if(e.kategori==="bimbingan") return `Bimbingan ${e.tahap}`;
  if(e.kategori==="tesisFinal") return `Naskah final — ${e.tahap}`;
  if(e.kategori==="ujianTingkat") return `Ujian Kenaikan Tingkat — ${e.jenjang}`;
  return "Entri";
}
function metaEntri(e){
  if(e.kategori==="kasus") return `${e.inisial||"—"}, ${e.usia||"—"} th · ${e.jk||"—"} · Peran: ${e.peran} · Supervisor: ${nama(e.supervisor)}`;
  if(e.kategori==="tindakan") return `Panduan ${e.panduan} · Peran: ${e.peran} · Komplikasi: ${e.komplikasi} · Supervisor: ${nama(e.supervisor)}`;
  if(e.kategori==="ilmiah") return `${e.peranIlmiah||"—"} · Pembimbing/Penguji: ${nama(e.pembimbing)}`
    + (e.penilaian ? ` · Nilai ${e.penilaian.total.toFixed(1)} (${e.penilaian.huruf})` : (e.nilai?` · Nilai: ${e.nilai}`:""));
  if(e.kategori==="jaga"){
    const g = e.gpsIn ? ` · GPS ${e.gpsIn.lat.toFixed(4)}, ${e.gpsIn.lng.toFixed(4)}` : " · GPS belum direkam";
    return `${e.jamMulai||"--:--"}–${e.jamSelesai||"--:--"}${e.jumlahKasus?` · ${e.jumlahKasus} kasus`:""}${g}`;
  }
  if(e.kategori==="bimbingan")
    return `${e.cara||"—"} · Pembimbing: ${nama(e.pembimbing)} · ${(e.materi||"").slice(0,80)}`;
  if(e.kategori==="tesisFinal")
    return `${e.judul||"(judul belum diisi)"} · Kepada ${nama(e.supervisor)}`;
  if(e.kategori==="ujianTingkat")
    return `Penguji: ${nama(e.supervisor)}`
      + (e.penilaian ? ` · Nilai ${e.penilaian.total.toFixed(1)} (${e.penilaian.huruf})` : "");
  if(e.kategori==="absensi"){
    return `${jam(e.masuk.waktu)}–${e.keluar?jam(e.keluar.waktu):"berjalan"}`
      + (e.durasiMenit!=null?` · ${durasiSingkat(e.durasiMenit)}`:"")
      + ` · ${e.masuk.dalam?"dalam area":"di luar area"}`;
  }
  return "";
}

/* ============ 9b. UNGGAH BUKTI ============ */
const kb = n => n < 1024*1024 ? Math.round(n/1024)+" KB" : (n/1048576).toFixed(1)+" MB";

// Gambar dikecilkan dulu di perangkat supaya unggahannya ringan.
// Hasilnya berkas asli (blob) yang nanti diunggah ke Supabase Storage saat
// entrinya disimpan -- bukan base64 yang ikut ditulis ke dalam data.
function kecilkanGambar(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej("Berkas gagal dibaca.");
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej("Berkas gambar tidak dapat dibuka.");
      img.onload = () => {
        const MAX = 1400;
        let w = img.width, h = img.height;
        if(Math.max(w,h) > MAX){ const sk = MAX/Math.max(w,h); w = Math.round(w*sk); h = Math.round(h*sk); }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        c.toBlob(blob => {
          if(!blob) return rej("Berkas gambar gagal diproses.");
          res({id:uid("b"), nama:file.name, tipe:"gambar", ukuran:blob.size, blob, previewUrl:URL.createObjectURL(blob)});
        }, "image/jpeg", 0.82);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function bacaPDF(file){
  return new Promise((res, rej) => {
    if(file.size > 10*1024*1024) return rej(`PDF "${file.name}" berukuran ${kb(file.size)}. Batas maksimal 10 MB.`);
    res({id:uid("b"), nama:file.name, tipe:"pdf", ukuran:file.size, blob:file, previewUrl:URL.createObjectURL(file)});
  });
}
async function tambahBukti(files){
  for(const f of files){
    if(draftBukti.length >= MAX_BUKTI){ toast(`Maksimal ${MAX_BUKTI} berkas per entri.`); break; }
    try{
      if(f.type.startsWith("image/")) draftBukti.push(await kecilkanGambar(f));
      else if(f.type === "application/pdf") draftBukti.push(await bacaPDF(f));
      else toast(`"${f.name}" bukan gambar atau PDF, jadi dilewati.`);
    }catch(err){ toast(typeof err === "string" ? err : "Berkas gagal diproses."); }
  }
  render();
}

// Unggah seluruh draftBukti ke Supabase Storage (bucket privat "bukti",
// wajib di dalam folder ber-nama id akun sendiri) dan kembalikan daftar
// lampiran siap disimpan ke kolom "lampiran" pada baris entri/cuti.
async function unggahLampiran(){
  const hasil = [];
  for(const b of draftBukti){

    if(error){ toast(`Gagal mengunggah "${b.nama}": ` + error.message); continue; }
    hasil.push({ nama: b.nama, tipe: b.tipe, ukuran: b.ukuran, path });
  }
  return hasil;
}

/* ============ 10. GPS ============ */
function jarakMeter(a,b,c,d){
  const R=6371000, r=Math.PI/180;
  const dp=(c-a)*r, dl=(d-b)*r;
  const x=Math.sin(dp/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function ambilGPS(which){
  if(!navigator.geolocation){
    draftGPS[which] = {error:"Perangkat atau browser ini tidak mendukung GPS."};
    return render();
  }
  toast("Mengambil lokasi…");
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude:lat, longitude:lng, accuracy:acc} = pos.coords;
    let dekat = null, min = Infinity;
    DB.lokasi.forEach(l => {
      const d = jarakMeter(lat,lng,l.lat,l.lng);
      if(d < min){ min = d; dekat = l; }
    });
    draftGPS[which] = {
      lat, lng, acc, waktu:new Date().toISOString(),
      dekat: dekat ? (min <= dekat.radius
        ? `Di dalam area ${dekat.nama} (±${Math.round(min)} m)`
        : `Terdekat: ${dekat.nama}, ±${Math.round(min)} m dari titik terdaftar`) : null
    };
    toast("Lokasi terekam"); render();
  }, err => {
    const pesan = {
      1:"Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini, lalu coba lagi.",
      2:"Sinyal lokasi tidak tersedia. Coba di area terbuka atau nyalakan GPS perangkat.",
      3:"Waktu pengambilan lokasi habis. Silakan coba lagi."
    }[err.code] || "Lokasi gagal diambil.";
    draftGPS[which] = {error:pesan}; render();
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
}

/* ============ 10b. ABSENSI GPS ============ */
function posisiSekarang(){
  return new Promise((res, rej) => {
    if(!navigator.geolocation) return rej("Perangkat atau browser ini tidak mendukung GPS.");
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}),
      e => rej({
        1:"Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini, lalu coba lagi.",
        2:"Sinyal lokasi tidak tersedia. Coba di area terbuka atau nyalakan GPS perangkat.",
        3:"Waktu pengambilan lokasi habis. Silakan coba lagi."
      }[e.code] || "Lokasi gagal diambil."),
      {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  });
}
function cekArea(lat, lng){
  let dekat = null, min = Infinity;
  DB.lokasi.forEach(l => { const d = jarakMeter(lat,lng,l.lat,l.lng); if(d < min){ min = d; dekat = l; } });
  if(!dekat) return {nama:"—", jarak:null, dalam:false};
  return {nama:dekat.nama, jarak:Math.round(min), dalam:min <= dekat.radius};
}
const jam = iso => new Date(iso).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}).replace(".",":");
const tglWaktu = iso => new Date(iso).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
function durasiTeks(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const h = String(Math.floor(t/3600)).padStart(2,"0");
  const m = String(Math.floor(t%3600/60)).padStart(2,"0");
  const d = String(t%60).padStart(2,"0");
  return `${h}:${m}:${d}`;
}
function durasiSingkat(menit){
  if(menit == null) return "—";
  const h = Math.floor(menit/60), m = menit%60;
  return (h ? h+" jam " : "") + m + " menit";
}
const absensiSaya = () => DB.entries.filter(e => e.kategori==="absensi" && e.userId===DB.aktif);
const sesiTerbuka = () => absensiSaya().find(e => !e.keluar);

async function absenMasuk(){
  if(sesiTerbuka()){ toast("Anda masih dalam sesi yang belum ditutup."); return; }
  const lokasi = val("a-lokasi"), kegiatan = val("a-kegiatan");
  toast("Mengambil lokasi…");
  let pos;
  try{ pos = await posisiSekarang(); }
  catch(err){ toast(typeof err === "string" ? err : "Lokasi gagal diambil."); return; }
  const area = cekArea(pos.lat, pos.lng);
  // masuk_waktu sengaja tidak dikirim -- diisi server (lihat trigger jaga_absensi).
  const { data, error } = await sb.from("absensi").insert({
    user_id: DB.aktif, kegiatan, lokasi_nama: lokasi,
    masuk_lat: pos.lat, masuk_lng: pos.lng, masuk_akurasi: pos.acc,
    masuk_dalam: area.dalam, masuk_jarak: area.jarak
  }).select().single();
  if(error){ toast("Gagal mencatat absen masuk: " + error.message); return; }
  DB.entries.push(absensiKeApp(data));
  toast(area.dalam ? `Absen masuk tercatat di ${area.nama}.`
                   : `Absen masuk tercatat, tetapi ${area.jarak} m di luar area ${area.nama}.`);
  render();
}

async function absenKeluar(){
  const sesi = sesiTerbuka();
  if(!sesi){ toast("Tidak ada sesi yang sedang berjalan."); return; }
  toast("Mengambil lokasi…");
  let pos;
  try{ pos = await posisiSekarang(); }
  catch(err){ toast(typeof err === "string" ? err : "Lokasi gagal diambil."); return; }
  const area = cekArea(pos.lat, pos.lng);
  // keluar_waktu sengaja tidak dikirim -- diisi server (lihat trigger jaga_absensi).
  const { data, error } = await sb.from("absensi").update({
    keluar_lat: pos.lat, keluar_lng: pos.lng, keluar_akurasi: pos.acc,
    keluar_dalam: area.dalam, keluar_jarak: area.jarak
  }).eq("id", sesi.id).select().single();
  if(error){ toast("Gagal mencatat absen keluar: " + error.message); return; }
  const hasil = absensiKeApp(data);
  Object.assign(sesi, hasil);
  toast(`Absen keluar tercatat. Lama bertugas ${durasiSingkat(sesi.durasiMenit)}.`);
  render();
}

// Menyalin satu entri logbook kategori "ilmiah" ke Kalender Akademik secara
// OTOMATIS (tanpa tombol/konfirmasi) begitu entrinya dikirim (bukan draf).
// Kebijakan RLS jadwal_akademik hanya mengizinkan peran ppds/admin mengunggah,
// jadi peran lain dilewati saja secara diam-diam.
async function sinkronEntriKeKalender(entriRow){
  const u = me();
  if(u.peran !== "ppds" && u.peran !== "admin") return;
  const rincian = entriRow.rincian || {};
  const { data: kal, error } = await sb.from("jadwal_akademik").insert({
    user_id: DB.aktif, nama_pengunggah: u.nama,
    tanggal: entriRow.tanggal, jenis_kegiatan: JENIS_KE_KALENDER[rincian.jenis] || null,
    mode_pelaksanaan: "luring",
    nama_presentan: u.nama, presentan_user_id: DB.aktif,
    judul_kegiatan: rincian.judul || rincian.jenis || null,
    nama_pembimbing: entriRow.supervisor_id ? nama(entriRow.supervisor_id) : null,
    status: u.peran === "admin" ? "disetujui" : "menunggu",
    status_pelaksanaan: "terlaksana", entri_tersinkron: true, sumber_entri_id: entriRow.id
  }).select().single();
  if(error){ console.error("Gagal sinkron otomatis ke kalender:", error.message); return; }
  await sb.from("entri").update({ kalender_id: kal.id }).eq("id", entriRow.id);
  const lokal = DB.entries.find(x => x.id === entriRow.id);
  if(lokal) lokal.kalenderId = kal.id;
}
/* --- rincian lengkap satu entri, untuk dibaca konsulen --- */
function barisGPS(g, label){
  if(!g) return [label, `<span class="muted">Belum direkam</span>`];
  const w = new Date(g.waktu).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
  return [label, `<span class="gps-detail">${g.lat.toFixed(5)}, ${g.lng.toFixed(5)}</span>
    <div class="muted" style="font-size:13px">Akurasi ±${Math.round(g.acc)} m &middot; direkam ${w}</div>
    <div style="font-size:13.5px; margin-top:2px">${esc(g.dekat||"Di luar radius titik lokasi terdaftar")}</div>
    <a href="https://www.google.com/maps?q=${g.lat},${g.lng}" target="_blank" rel="noopener"
       style="font-size:13px">Buka di peta</a>`];
}
function detailEntri(e){
  const kosong = `<span class="muted">—</span>`;
  const v = x => (x===null||x===undefined||x==="") ? kosong : esc(x);
  let baris = [["Tanggal", tglID(e.tanggal)], ["Pencatat", esc(nama(e.userId))]];

  if(e.kategori==="kasus") baris = baris.concat([
    ["Modalitas", v(e.modalitas)], ["Regio", v(e.regio)],
    ["No. rekam medis", v(e.noRM)], ["Inisial pasien", v(e.inisial)],
    ["Usia", e.usia ? esc(e.usia)+" tahun" : kosong], ["Jenis kelamin", v(e.jk)],
    ["Diagnosis klinis", v(e.diagnosis)],
    ["Kesan radiologis", `<span class="long">${v(e.kesan)}</span>`],
    ["Peran peserta", v(e.peran)]
  ]);
  else if(e.kategori==="tindakan") baris = baris.concat([
    ["Jenis tindakan", v(e.jenisTindakan)], ["Panduan pencitraan", v(e.panduan)],
    ["No. rekam medis", v(e.noRM)], ["Indikasi", v(e.indikasi)],
    ["Peran peserta", v(e.peran)], ["Komplikasi", v(e.komplikasi)]
  ]);
  else if(e.kategori==="ilmiah") baris = baris.concat([
    ["Jenis kegiatan", v(e.jenis)], ["Peran peserta", v(e.peranIlmiah)],
    ["Judul / topik", `<span class="long">${v(e.judul)}</span>`],
    ["Pembimbing / penguji", esc(nama(e.pembimbing))],
    ["Hasil penilaian", e.penilaian ? tampilNilai(e.penilaian)
      : (e.nilai ? esc(e.nilai) : `<span class="muted">Belum dinilai</span>`)]
  ]);
  else if(e.kategori==="jaga") baris = baris.concat([
    ["Jenis kegiatan", v(e.jenis)], ["Lokasi", v(e.lokasi)],
    ["Jam", `${esc(e.jamMulai||"--:--")} – ${esc(e.jamSelesai||"--:--")}`],
    ["Jumlah kasus", v(e.jumlahKasus)],
    barisGPS(e.gpsIn, "GPS saat mulai"), barisGPS(e.gpsOut, "GPS saat selesai")
  ]);

  if(e.kategori==="bimbingan") baris = baris.concat([
    ["Tahap", v(e.tahap)], ["Cara bimbingan", v(e.cara)],
    ["Pembimbing", esc(nama(e.pembimbing))],
    ["Materi dibimbingkan", `<span class="long">${v(e.materi)}</span>`],
    ["Arahan dan hasil", `<span class="long">${v(e.hasil)}</span>`]
  ]);
  else if(e.kategori==="tesisFinal") baris = baris.concat([
    ["Tahap", v(e.tahap)], ["Judul tesis", `<span class="long">${v(e.judul)}</span>`],
    ["Bimbingan tertandatangani", (()=>{ const n = DB.entries.filter(x=>x.kategori==="bimbingan"
        && x.userId===e.userId && x.tahap===e.tahap && x.status==="terverifikasi").length;
      const min = infoTahap(e.tahap).min;
      return `${n} dari ${min} ${n>=min?`<span class="pill p-ver">terpenuhi</span>`:`<span class="pill p-rev">belum terpenuhi</span>`}`; })()]
  ]);
  if(e.kategori==="absensi"){
    const t = (g,l) => [l, g ? `<span class="gps-detail">${g.lat.toFixed(5)}, ${g.lng.toFixed(5)}</span>
        <div class="muted" style="font-size:13px">${tglWaktu(g.waktu)} &middot; akurasi ±${Math.round(g.acc)} m</div>
        <div style="margin-top:4px">${tandaArea(g)}</div>
        <a href="https://www.google.com/maps?q=${g.lat},${g.lng}" target="_blank" rel="noopener" style="font-size:13px">Buka di peta</a>`
      : `<span class="muted">Belum tercatat</span>`];
    baris = baris.concat([
      ["Kegiatan", v(e.kegiatan)], ["Lokasi", v(e.lokasi)],
      ["Lama bertugas", e.durasiMenit!=null ? durasiSingkat(e.durasiMenit) : "Sesi masih berjalan"],
      t(e.masuk,"Absen masuk"), t(e.keluar,"Absen keluar")
    ]);
  }
  baris.push(["Supervisor dituju", esc(nama(e.supervisor||e.pembimbing))]);
  baris.push(["Catatan peserta", `<span class="long">${v(e.catatan)}</span>`]);
  baris.push(["Bukti pendukung", (e.bukti && e.bukti.length)
    ? `${petakBukti(e.bukti, e.id)}<div class="muted" style="font-size:12.5px; margin-top:5px">Ketuk berkas untuk memperbesar.</div>`
    : `<span class="muted">Tidak ada lampiran</span>`]);

  return `<div class="detail"><dl class="dl">${baris.map(([t,d]) =>
    `<div><dt>${t}</dt><dd>${d}</dd></div>`).join("")}</dl></div>`;
}

function kartuVerifikasi(e){
  const buka = detailBuka === e.id;
  const dibaca = sudahDibaca.has(e.id);
  const tulisRevisi = kotakRevisi === e.id;
  const dinilai = butuhNilai(e);
  const lengkap = dinilai ? nilaiLengkap(draftNilai[e.id]) : true;
  const siap = dibaca && lengkap;
  const pesan = !dibaca ? "Buka rincian lengkap dulu sebelum memverifikasi."
    : (dinilai && !lengkap) ? "Peserta ini presentan. Isi nilai akhir sebelum memverifikasi."
    : "Rincian sudah Anda baca. Entri siap diverifikasi.";
  return `<div class="entry">
    <div class="entry-top"><time>${tglID(e.tanggal)}</time>${pill(e.status)}
      <span class="muted" style="font-size:13px">${esc(nama(e.userId))}</span></div>
    <h4>${esc(judulEntri(e))}</h4>
    <div class="meta">${esc(metaEntri(e))}</div>

    ${dinilai ? `<span class="pill p-tunggu" style="margin-top:7px">Presentan &middot; perlu dinilai</span>` : ""}

    ${buka ? detailEntri(e) : ""}
    ${buka && dinilai ? lembarPenilaian(e) : ""}

    <div class="readgate ${siap?"ok":""}" id="gate-${e.id}">${pesan}</div>

    <div class="acts">
      <button class="btn btn-o btn-s" data-act="detail" data-id="${e.id}" aria-expanded="${buka}">
        ${buka ? "Tutup rincian" : (dinilai ? "Baca rincian & isi penilaian" : "Baca rincian lengkap")}</button>
      <button class="btn btn-p btn-s" data-act="setuju" data-id="${e.id}" ${siap?"":"disabled"}>
        ${dinilai ? "Simpan nilai & verifikasi" : "Verifikasi"}</button>
      <button class="btn btn-o btn-s" data-act="revisi" data-id="${e.id}" ${dibaca?"":"disabled"}>Minta revisi</button>
    </div>

    ${tulisRevisi ? `<div class="revbox">
      <div class="field" style="margin-bottom:9px">
        <label>Catatan revisi untuk peserta</label>
        <textarea id="rev-${e.id}" placeholder="Contoh: Kesan radiologis belum lengkap, mohon sertakan diagnosis banding."></textarea>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn btn-p btn-s" data-act="kirimRevisi" data-id="${e.id}">Kirim permintaan revisi</button>
        <button class="btn btn-o btn-s" data-act="batalRevisi">Batal</button>
      </div></div>` : ""}
  </div>`;
}

const LABEL_TABEL_LOG = {
  profil: "Akun / Profil", jadwal_akademik: "Kalender Akademik", entri: "Logbook",
  cuti: "Cuti & Izin", pengajuan_semester: "Pengajuan Semester", konten_beranda: "Halaman Utama"
};
const LABEL_OPERASI_LOG = {INSERT:"Ditambahkan", UPDATE:"Diubah", DELETE:"Dihapus"};

function ringkasBarisLog(l){
  const d = l.data_baru || l.data_lama || {};
  if(l.tabel === "profil") return d.nama || d.email || "—";
  if(l.tabel === "jadwal_akademik") return d.judul_kegiatan || d.jenis_kegiatan || "—";
  if(l.tabel === "entri") return (d.rincian && d.rincian.judul) || d.kategori || "—";
  if(l.tabel === "konten_beranda") return d.judul || "—";
  if(l.tabel === "cuti") return d.jenis || "—";
  if(l.tabel === "pengajuan_semester") return "Semester " + (d.semester_diajukan || "—");
  return "—";
}

function kartuLog(l){
  const dibuka = String(l.id) === logDibuka;

function tabelSemester(u){
  const r = rekapSemester(u);
  const kunci = Object.keys(r).map(Number).sort((a,b)=>a-b);
  if(!kunci.length) return `<div class="empty"><b>Belum ada data</b>Rekap muncul setelah ada entri logbook yang tercatat.</div>`;
  const skr = semesterKini(u);
  return `<div class="tw"><table>
    <tr><th>Semester</th><th>Rentang entri</th><th>Kasus</th><th>Tindakan</th><th>Ilmiah</th>
        <th>Jaga</th><th>Hari hadir</th><th>Hari cuti</th><th>Rerata presentasi</th></tr>
    ${kunci.map(k=>{ const d=r[k];
      const rer = d.nilai.length ? (d.nilai.reduce((a,b)=>a+b,0)/d.nilai.length) : null;
      return `<tr${k===skr?' style="background:var(--usu-soft)"':''}>
        <td><b>Semester ${k}</b>${k===skr?' <span class="pill p-ver">berjalan</span>':''}</td>
        <td class="mono" style="font-size:12.5px">${d.mulai?tglID(d.mulai):"—"} &ndash; ${d.akhir?tglID(d.akhir):"—"}</td>
        <td class="mono">${d.kasus}</td><td class="mono">${d.tindakan}</td><td class="mono">${d.ilmiah}</td>
        <td class="mono">${d.jaga}</td><td class="mono">${d.hadir}</td><td class="mono">${d.cuti||0}</td>
        <td class="mono">${rer!=null ? rer.toFixed(1)+" ("+hurufMutu(rer)+")" : "—"}</td></tr>`;
    }).join("")}
  </table></div>`;
}

const infoTahap = n => TAHAP_TESIS.find(t => t.n === n) || TAHAP_TESIS[0];

  return (DB.tesis||[]).find(x => x.userId===userId && x.tahap===tahap)
    || {id:null, userId, tahap, judul:"", p1:"", p2:""};
}
const bimbinganTahap = (userId, tahap) =>
  DB.entries.filter(e => e.kategori==="bimbingan" && e.userId===userId && e.tahap===tahap)
            .sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
const finalTahap = (userId, tahap) =>
  DB.entries.find(e => e.kategori==="tesisFinal" && e.userId===userId && e.tahap===tahap);

// PDF tesis boleh lebih besar daripada lampiran bukti biasa.
function bacaPDFTesis(file){
  return new Promise((res, rej) => {
    if(file.type !== "application/pdf") return rej("Berkas tesis harus berformat PDF.");
    if(file.size > MAX_PDF_TESIS)
      return rej(`Berkas ${kb(file.size)}. Batas ${kb(MAX_PDF_TESIS)}. Kecilkan dulu atau kirim versi ringkas.`);
    res({id:uid("b"), nama:file.name, tipe:"pdf", ukuran:file.size, blob:file, previewUrl:URL.createObjectURL(file)});
  });
}

function unduhCSV(list, namaBerkas){
  const kol = ["tanggal","nama","kategori","judul","rincian","status","supervisor","gps","jumlah_bukti"];
  const rows = [kol.join(",")].concat(list.map(e => [
    e.tanggal, nama(e.userId), e.kategori, judulEntri(e), metaEntri(e), STATUS[e.status].l,
    nama(e.supervisor||e.pembimbing),
    e.gpsIn ? `${e.gpsIn.lat.toFixed(5)} ${e.gpsIn.lng.toFixed(5)}` : "",
    (e.bukti||[]).length
  ].map(v => `"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")));
  const blob = new Blob(["\uFEFF"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = namaBerkas;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Berkas CSV diunduh.");
}

document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.classList && el.classList.contains("skor")){
    const id = el.dataset.e;
    let v = el.value === "" ? "" : Math.max(0, Math.min(100, Number(el.value)));
    draftNilai[id] = v;
    const lengkap = nilaiLengkap(v);
    const box = document.getElementById("hasil-"+id);
    if(box) box.innerHTML = ringkasNilai(v);
    const gate = document.getElementById("gate-"+id);
    const btn = document.querySelector('[data-act="setuju"][data-id="'+id+'"]');
    if(btn) btn.disabled = !(sudahDibaca.has(id) && lengkap);
    if(gate){
      gate.classList.toggle("ok", lengkap);
      gate.textContent = lengkap ? "Nilai terisi. Entri siap diverifikasi."
        : "Peserta ini presentan. Isi nilai akhir sebelum memverifikasi.";
    }
  }
  if(el.id && el.id.indexOf("cat-") === 0) draftCatatanNilai[el.id.slice(4)] = el.value;
});

document.addEventListener("change", e => {
  if(e.target && e.target.id === "d-peran"){ daftarPeran = e.target.value; render(); return; }
  if(e.target && e.target.id === "f-sesi"){ sesiJagaDipilih = e.target.value; render(); return; }

});

function render(){
  const bar = document.querySelector(".topbar"), nav = document.querySelector(".nav");
  if(sesiPemulihan){
    bar.style.display = "none"; nav.style.display = "none";
    document.body.classList.remove("punya-sidebar");
    document.body.classList.add("bg-foto");
    document.getElementById("view").innerHTML = vResetSandi();
    return;
  }
  if(!DB.sesiLogin){
    bar.style.display = "none"; nav.style.display = "none";
    document.body.classList.remove("punya-sidebar");
    document.body.classList.add("bg-foto");
    document.getElementById("view").innerHTML = vLogin();
    return;
  }
  if(me().statusAkun && me().statusAkun !== "aktif"){
    bar.style.display = "none"; nav.style.display = "none";
    document.body.classList.remove("punya-sidebar");
    document.body.classList.remove("bg-foto");
    document.getElementById("view").innerHTML = vMenunggu();
    return;
  }
  if(isPesertaPeran(me().peran) && profilBelumLengkap(me())){
    bar.style.display = ""; nav.style.display = "none";
    document.body.classList.remove("punya-sidebar");
    document.body.classList.remove("bg-foto");
    document.getElementById("view").innerHTML =
      `<div class="banner">Lengkapi data diri Anda terlebih dahulu (NIK, tempat, dan tanggal lahir) sebelum menggunakan logbook.</div>`
      + vProfilSaya();
    return;
  }
  bar.style.display = ""; nav.style.display = "";
  document.body.classList.add("punya-sidebar");
  document.body.classList.remove("bg-foto");
  renderUsers(); renderNav();
  const v = {
    beranda:vBeranda, kasus:formKasus, tindakan:formTindakan, ilmiah:formIlmiah,
    jaga:formJaga, riwayat:vRiwayat, verifikasi:vVerifikasi, semua:vSemua, pengaturan:vPengaturan,
    konten:vKontenBeranda, log:vLogAktivitas,
    absensi:vAbsensi, pantau:vPantau, akun:vAkun, semester:vSemester, profil:vProfilSaya,
    cuti: me().peran==="admin" ? vCutiAdmin : vCuti,
    tesis: me().peran==="ppds" ? vTesis : vTesisPantau,
    ujian: formUjianTingkat,
    peserta: pesertaDibuka ? vPesertaProfil : vDaftarPeserta
  }[tab] || vBeranda;
  document.getElementById("view").innerHTML = v() + vLightbox();
  if(!lightbox) window.scrollTo({top:0, behavior:"instant"});
}

jamHidupTick();
setInterval(() => {
  const el = document.getElementById("jamJalan");
  if(el && el.dataset.mulai) el.textContent = durasiTeks(Date.now() - new Date(el.dataset.mulai));
  jamHidupTick();
}, 1000);

(async function init(){
  DB = { aktif: null, users: [], entries: [], tesis: [], cuti: [], lokasi: [], sesiLogin: false };

  // Supabase mengirim pesan error lewat fragment URL (#error=...) kalau tautan
  // verifikasi/reset kata sandi sudah kedaluwarsa, sudah dipakai, atau tidak
  // valid. Tanpa ini, halaman diam-diam kembali ke layar Masuk tanpa
  // penjelasan apa pun ke pengguna.
  if(window.location.hash.includes("error=")){
    const param = new URLSearchParams(window.location.hash.slice(1));
    const kode = param.get("error_code");
    if(kode === "otp_expired"){
      toast("Tautan sudah kedaluwarsa atau sudah pernah dipakai. Silakan minta tautan baru lewat \"Lupa kata sandi?\".");
    } else {
      toast("Tautan tidak valid: " + (param.get("error_description") || kode || "kesalahan tidak diketahui").replace(/\+/g, " "));
    }
    history.replaceState(null, "", window.location.pathname);
  }

  // Identitas akun: sungguhan lewat Supabase Auth + tabel profil.
  sb.auth.onAuthStateChange(async (event, session) => {
    if(event === "PASSWORD_RECOVERY"){
      sesiPemulihan = true; render(); return;
    }
    if(session && session.user){
      await muatProfilAktif(session.user.id);
    } else {
      DB.users = []; DB.aktif = null; DB.sesiLogin = false;
      editNilaiId = null;
      kontenJenis = "berita"; editKontenId = null;
      filterTabelLog = "semua"; logDibuka = null;
      document.getElementById("railPanelAdmin").hidden = true;
    }
    render();
  });
})();
</script>
